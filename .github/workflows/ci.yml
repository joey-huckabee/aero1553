name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Normalize git line endings on Windows
        # Without this, actions/checkout honors the runner-global
        # core.autocrlf=true on Windows and converts LF -> CRLF on
        # text files at checkout, which can produce false-positive
        # diffs in `cargo fmt --check` and PUML rendering.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain and components
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy llvm-tools-preview rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --locked --all-targets

      - name: Run Rust doctests
        # `--all-targets` above skips doctests, so run them explicitly. This
        # compiles the README library example (included via include_str! in
        # src/lib.rs) so it cannot silently rot.
        working-directory: rust
        run: cargo test --locked --doc

      - name: Install cargo-llvm-cov
        # Coverage gate runs only on Linux — coverage isn't platform-
        # dependent so the Windows cell would just duplicate work.
        # Windows builds remain functional smoke for path / line-ending
        # portability bugs.
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6
          fallback: none

      - name: Enforce Rust coverage gate
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo cov-ci --locked

      - name: Generate Rust LCOV report
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo cov-lcov --locked

      - name: Upload Rust LCOV report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: rust-lcov
          path: rust/lcov.info
          if-no-files-found: error

  rust-doc:
    name: Rust docs (rustdoc -D warnings)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-doc-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/.cargo/config.toml') }}
          restore-keys: |
            cargo-doc-${{ runner.os }}-

      - name: Build docs with warnings denied
        # Catches broken intra-doc links and other rustdoc lints in the
        # doc-heavy crate. --no-deps documents only this crate (not memmap2).
        working-directory: rust
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked

  rust-msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install MSRV toolchain (1.88)
        # The main `rust` job builds on stable, which would silently accept a
        # newer-than-MSRV std/language feature. This job pins the declared
        # rust-version (Cargo.toml) so the MSRV claim is actually enforced.
        shell: bash
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          rustup default 1.88

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/.cargo/config.toml') }}
          restore-keys: |
            cargo-msrv-${{ runner.os }}-

      - name: Check on MSRV (1.88)
        working-directory: rust
        run: cargo check --locked --all-targets

  cargo-deny:
    name: Rust supply chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run cargo-deny
        # Checks advisories (RustSec), licenses, bans, and sources against
        # rust/deny.toml. The action installs cargo-deny and fetches a fresh
        # advisory DB, so a newly-published advisory on a dependency fails CI.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check

  cargo-semver-checks:
    name: Rust SemVer (cargo-semver-checks)
    # DISABLED until the v4.0.0 tag exists -- RE-ENABLE AT THE v4.0.0 CUT.
    # The crate was renamed mie-decoder -> aero1553, and cargo-semver-checks
    # matches the baseline by package name: v3.0.0 has no `aero1553`, so the
    # comparison cannot run at all ("package `aero1553` not found"). Once
    # v4.0.0 is tagged the baseline carries the new name and the gate works
    # again unchanged.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history + tags so the baseline tag resolves

      - name: Determine baseline (latest release tag)
        id: baseline
        shell: bash
        run: echo "rev=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Determine release type from the version bump
        id: release_type
        shell: bash
        # `minor` while a release is being prepared, `major` once the crate has
        # actually declared one. Hardcoding `minor` was right for every release
        # until v3.0.0 and wrong for that one: it blocks a deliberate breaking
        # change with the same failure it uses to catch an accidental one, so
        # the gate would have to be edited (and remembered to be edited back) at
        # exactly the moment it matters most. Deriving it keeps the guarantee --
        # a break still needs a major bump -- while letting the bump itself say
        # so.
        run: |
          declared="$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)"
          baseline="${{ steps.baseline.outputs.rev }}"
          baseline="${baseline#v}"
          if [ "${declared%%.*}" != "${baseline%%.*}" ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          else
            echo "type=minor" >> "$GITHUB_OUTPUT"
          fi
          echo "declared=$declared baseline=$baseline" >&2

      - name: Run cargo-semver-checks
        # Compares the crate's public API against the latest release tag and
        # fails on a breaking change that the declared version does not account
        # for. `minor` (the usual case, where the crate version is static
        # between releases) lets additive changes pass and blocks a break;
        # `major` applies only once Cargo.toml has declared the major bump.
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: rust/Cargo.toml
          baseline-rev: ${{ steps.baseline.outputs.rev }}
          release-type: ${{ steps.release_type.outputs.type }}

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full version matrix on Linux (production target).
          - { os: ubuntu-latest,  python-version: "3.10" }
          - { os: ubuntu-latest,  python-version: "3.11" }
          - { os: ubuntu-latest,  python-version: "3.12" }
          - { os: ubuntu-latest,  python-version: "3.13" }
          - { os: ubuntu-latest,  python-version: "3.14" }
          # Cross-platform smoke on Windows: the current support pin
          # (3.12, used for build / uv lock --check / conformance)
          # plus the latest supported version (3.14). Catches path,
          # encoding, and line-ending issues that don't surface on
          # Linux without ballooning the matrix.
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }

    steps:
      - name: Normalize git line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Display tool versions
        shell: bash
        run: |
          uv --version
          uv --directory python run python --version
          rustc --version

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run Python tests
        run: uv --directory python run pytest

      - name: Validate Python package metadata and lockfile
        # Lockfile + metadata validation and the dist build only need
        # to run once. Keep them on the Linux 3.12 cell — that pin
        # mirrors the pre-existing single-cell behavior.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv --directory python lock --check

      - name: Build Python package
        # One abi3 wheel serves every supported CPython, so the tag is part
        # of the contract: a build that lost `abi3-py310` would still
        # succeed, and only produce a wheel for one interpreter.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: python
        shell: bash
        run: |
          uv build
          ls dist
          ls dist/*-cp310-abi3-*.whl

  python-coverage:
    name: Python coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Enforce Python coverage gate
        # Coverage gate runs once on Linux/3.12 — coverage isn't
        # platform- or interpreter-dependent, so running it across the
        # full python-job matrix would waste CI minutes. Mirrors how
        # cargo cov-ci is invoked only on the Linux cell of the Rust
        # job. The floor (92% combined line+branch) is `fail_under` in
        # python/pyproject.toml's [tool.coverage.report] — see the comment
        # block there for the ratchet rationale.
        run: uv --directory python run pytest --cov --cov-report=term-missing

  mypy:
    name: Python type check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run mypy (strict)
        # mypy analyzes the package as python_version 3.10 (set in
        # python/pyproject.toml [tool.mypy]) regardless of the running
        # interpreter, so a single cell is sufficient — same rationale as
        # the coverage gate. working-directory: python so mypy picks up the
        # [tool.mypy] config and `src` resolves to the package source.
        working-directory: python
        run: uv run mypy src

  pylint:
    name: Python lint (pylint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run pylint
        # Lints the package source (src/aero1553). The config — curated
        # disables (lazy imports, the too-many-* family already covered by
        # SonarCloud, etc.) and max-line-length — lives in
        # python/pyproject.toml's [tool.pylint.*]. working-directory: python so
        # pylint picks up that config and resolves the package's imports. The
        # gate fails on any message (pylint exits non-zero below 10/10).
        working-directory: python
        run: uv run pylint src/aero1553

  ruff:
    name: Python lint + format (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run ruff check
        # Lints the package source + tests (config in python/pyproject.toml
        # [tool.ruff]). working-directory: python so ruff picks up the config.
        working-directory: python
        run: uv run ruff check

      - name: Run ruff format --check
        # Verifies the package + tests are ruff-formatted (Black-style, line
        # length 100 to match the pylint gate). Run `ruff format` to fix.
        working-directory: python
        run: uv run ruff format --check

  vulture:
    name: Python dead code (vulture)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run vulture
        # Finds unused (dead) code across the package + tests. Scan paths and
        # intentional-name ignores (interface args, documented constants) are in
        # python/pyproject.toml [tool.vulture]. Exits non-zero on any finding.
        working-directory: python
        run: uv run vulture

  bandit:
    name: Python security (bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Run bandit
        # Security static analysis (SAST) over the package source. Scans
        # src/aero1553 only — not tests, whose asserts bandit's B101 would
        # flag. Exits non-zero on any finding at the default severity/confidence.
        working-directory: python
        run: uv run bandit -r src/aero1553

  conformance:
    name: Rust/Python conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Normalize git line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install aero1553 and runtime dependencies
        # The conformance job runs both CLIs and diffs CSV output. It
        # does not need uv-locked dependency versions — only the
        # aero1553 package and its declared runtime deps available
        # to `python -m aero1553`. Installing directly into the
        # actions/setup-python interpreter with pip is the simplest
        # form that works the same way on every hosted runner.
        run: python -m pip install -e ./python

      - name: Verify aero1553 is importable
        run: python -c "import aero1553; print('aero1553 at:', aero1553.__file__)"

      - name: Run cross-implementation conformance suite
        # run.py already handles the .exe suffix on Windows when
        # locating rust/target/debug/aero1553, so the same invocation
        # works on both runners.
        #
        # `--skip cpp` is explicit rather than implied: the runner defaults to
        # every registered implementation and fails if one is missing, so a job
        # that opts out has to say so. The alternative -- silently running
        # whichever binaries happen to exist -- would let this job report a full
        # pass after a build step had quietly failed. The C++ side is gated by
        # the conformance jobs in cpp-ci.yml, which build it first.
        run: python tests/conformance/run.py --skip cpp

  repo-hygiene:
    name: Repo hygiene (pre-commit backstop)
    runs-on: ubuntu-latest
    # Re-runs the file-level checks from .githooks/pre-commit over the whole
    # tracked tree. The hook is skippable (`git commit --no-verify`) and until
    # v2.12.0 nothing in CI re-ran it, so CONTRIBUTING's "CI runs the same
    # checks" was untrue for most of the list: a CRLF blob, a stray dbg!(), a
    # merge marker, an oversized file or a committed *.mie could all land
    # unnoticed. This is that backstop.

    steps:
      - name: Check out repository
        # eol conversion is left off so the index/worktree comparison the
        # script makes is meaningful.
        uses: actions/checkout@v6

      - name: Run repo hygiene checks
        run: bash scripts/repo-hygiene.sh

  trace-matrix:
    name: Requirements trace matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify TRACE-MATRIX.md is up to date
        run: python scripts/build-trace-matrix.py --check
