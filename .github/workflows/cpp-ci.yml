name: C++ CI

# Build, test and gate the C++ tree under cpp/. Separate from ci.yml so the
# three implementations gate independently: a Rust or Python change must not
# wait on a Valgrind run, and a C++ change must not wait on the Python matrix.
#
# THREE TIERS (ADR-0001, ADR-0003):
#   1. modern toolchain  -- fast feedback, plus the instrumentation GCC 4.8
#                           cannot host (LSan, full UBSan). NOT libFuzzer:
#                           the fuzz harness is a deterministic Catch2 case
#                           so it runs on every tier, including 2 and 3.
#                           See cpp/tests/test_fuzz.cpp for why.
#   2. gcc 4.8.5         -- fidelity for the SLES 12 SP5 system compiler
#   3. MSVC              -- the shipping Windows artifact (ADR-0003)
#   ( real SLES 12 SP5   -- NOT here. Deployability is verified by hand on
#                           hardware; the container proves C++11 conformance
#                           only, not deployability. )
#
# Tier 2 runs the FULL test suite, not just a compile. That is what closes the
# gap between the instrumented build and the shipped build -- do not reduce it
# to `make all`. It is also the only tier that enforces the C++11 boundary:
# MSVC has no /std:c++11 and compiles this source as C++14, so it silently
# accepts two constructs GCC 4.8.5 rejects (see CONTRIBUTING.md).
#
# TOOLCHAIN POLICY
# Runner images and analysis tools are pinned by explicit version.
# `ubuntu-latest` is deliberately not used: it is a moving pointer, and a
# GitHub-side bump turns jobs red with no code change behind them.
#
# The modern toolchain is an *instrument*, not a target -- it never produces a
# shipped artifact, so tracking current versions carries no SLES 12 risk.
#
# WHY apt-get RATHER THAN A PREBUILT IMAGE
# background-file-mover maintains a ghcr.io toolchain image for its modern tier,
# and its Makefile records the reason: it already maintained the GCC 4.8.5
# mirror, so the cost of a second image was marginal. This repository maintains
# no images, and the note that image replaced -- "that is the price of not
# maintaining a second distro" -- is the right trade here for now. Revisit when
# the install time becomes the dominant cost of a run, and when it does, publish
# ghcr.io/joey-huckabee/mie-ci rather than pointing at another project's image:
# a shared image means a change made for one repository silently changes what
# the other's gates check.
#
# What the image DID buy background-file-mover is a current analyser, and
# Ubuntu 24.04 packages clang 18 as its newest. Staying current is worth it --
# 18 -> 20 found a real fread-past-EOF loop here that 18 passed, and 20 -> 22
# found twenty const-correctness misses in the test tree -- but it does not
# require an image. The clang-tidy and clang-format jobs add the LLVM project's
# own apt repository instead, which costs one step and keeps the no-image
# decision intact. The version they install is `env.LLVM_VERSION` below; this
# repository does not track whichever version that image happens to carry.
#
# The GCC 4.8.5 mirror IS reused, because it is an immutable pin of a 2015
# compiler rather than a moving toolchain.

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"
      - "scripts/assert-platform-confined.sh"
      - "scripts/assert-locale-free.sh"
      - "scripts/assert-sources-agree.sh"
      # The shared conformance suite is part of the C++ contract even though it
      # lives outside cpp/: manifest.json says what every implementation must
      # satisfy and expected/ holds the bytes they are compared against. A case
      # added there can break C++ while touching nothing under cpp/, and
      # ci.yml's conformance job runs `--skip cpp`, so nothing else would catch
      # it.
      - "tests/conformance/**"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-ci.yml"
      - "scripts/assert-platform-confined.sh"
      - "scripts/assert-locale-free.sh"
      - "scripts/assert-sources-agree.sh"
      # The shared conformance suite is part of the C++ contract even though it
      # lives outside cpp/: manifest.json says what every implementation must
      # satisfy and expected/ holds the bytes they are compared against. A case
      # added there can break C++ while touching nothing under cpp/, and
      # ci.yml's conformance job runs `--skip cpp`, so nothing else would catch
      # it.
      - "tests/conformance/**"

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A job with `container:` defaults to `sh`, not `bash`. Nothing here relies on
# a bash-ism today; this is set so the first one someone writes fails on their
# branch rather than mysteriously only inside a container.
defaults:
  run:
    shell: bash

env:
  # The Makefile honours CXX, so this selects the compiler for the functional,
  # sanitizer and coverage tiers alike. Deliberately newer than the image
  # default (g++-13 on ubuntu-24.04), because newer analysers find more.
  CXX: g++-14

  # The analyser major version, in ONE place in this file. `cpp/Makefile` pins
  # the same number as LLVM_VERSION for `make verify-ci`, and
  # `scripts/repo-hygiene.sh` fails the build if the two disagree -- before that
  # check existed the pairing was a comment asking two files to be edited
  # together, which is not a mechanism.
  #
  # Ubuntu 24.04 packages clang 18 as its newest, so this comes from the LLVM
  # project's own apt repository. Newer genuinely finds more: moving 18 -> 20
  # surfaced a real fread-past-EOF loop in the platform tests that 18 waved
  # through, which is the precedent for keeping this current rather than letting
  # it settle on whatever the distro ships.
  LLVM_VERSION: "22"

jobs:
  build-test-modern:
    name: build & test (g++-14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-14 locales
      # Two hostile locales, generated so the locale-independence tests can
      # actually switch to them. Without them those tests find setlocale
      # returning NULL, downgrade themselves to a WARN, and the gate silently
      # checks less than it appears to -- it would still pass on a build that
      # emitted "1,234500" into every DELTA cell.
      #
      # de_DE has a comma decimal separator, which is what would corrupt DELTA.
      # tr_TR redefines the case mapping of 'i' and 'I' specifically, which is
      # what would make a <cctype>-based config or CLI parser stop recognising
      # a key. They break different things, so both are needed.
      - name: Generate the hostile locales
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale
      # Printed so a toolchain change shows up as a visible diff in the log
      # rather than as an unexplained warning in some other job.
      - name: Toolchain versions
        run: make -C cpp versions
      - name: Build
        run: make -C cpp -j"$(nproc)" all
      - name: Test
        run: make -C cpp -j"$(nproc)" check
      # A smoke check that the linked binary actually runs. The byte-exact
      # comparison against the shared oracles is the `conformance` job below.
      - name: CLI smoke
        run: |
          BIN=$(make -C cpp -s print-decoder-bin)
          "cpp/${BIN#cpp/}" --version | od -c | head -3
          test "$("cpp/${BIN#cpp/}" --version)" = "aero1553 3.0.0"

  # Fidelity job: the SLES 12 SP5 system compiler, via a mirror of the official
  # gcc:4.8 image (Debian 7 "wheezy", glibc 2.13, GCC 4.8.5).
  #
  # It is a PROXY, not the target: older glibc (2.13 vs SUSE's 2.22), different
  # kernel. Being *older* makes it a conservative floor -- passing here implies
  # passing there -- but it proves C++11 conformance, not deployability.
  #
  # This does NOT use a job-level `container:`. Doing so runs every step inside
  # the image, and node-based actions (checkout, upload-artifact) cannot execute
  # against glibc 2.13. The runner checks out with modern tooling instead and
  # the old compiler is invoked over the mounted workspace, so the container
  # only has to compile -- which is all it is good for.
  #
  # CXX is unset deliberately: inside the container the only compiler is GCC
  # 4.8.5's `g++`, and the workflow-level g++-14 must not leak in.
  build-test-gcc48:
    name: build & test (gcc 4.8.5)
    runs-on: ubuntu-24.04
    env:
      CXX: ""
    steps:
      - uses: actions/checkout@v6
      # Driven through the Makefile target rather than a hand-written
      # `docker run`, so this job and a developer's `make check-gcc48` are the
      # same command reading the same GCC48_IMAGE. Separately maintained copies
      # of that invocation are how CI and local come to pull different images
      # without either noticing.
      #
      # A mirror of docker.io/library/gcc:4.8, byte-identical, republished with
      # a v2s2 manifest: the upstream tag was pushed in 2016 with a manifest v2
      # *schema 1*, which modern Docker refuses by default. Keep this in step
      # with GCC48_IMAGE in cpp/Makefile.
      - name: Build and test on GCC 4.8.5
        run: make -C cpp check-gcc48 CI_ENGINE=docker

  # The shipping Windows artifact (ADR-0003). Not a convenience build: the
  # suite pins behaviours that differ from POSIX -- replacing an existing
  # destination, no CRLF translation on stdout, shared read on the in-progress
  # temp file -- and two of those were found by running this suite rather than
  # by reading documentation.
  build-test-msvc:
    name: build & test (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -B cpp/build-msvc -S cpp -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build cpp/build-msvc --config Release
      - name: Test
        run: ctest --test-dir cpp/build-msvc -C Release --output-on-failure
      # LF, not CRLF. Without _setmode(_fileno(stdout), _O_BINARY) the CRT
      # rewrites newlines and every stdout oracle fails on Windows alone.
      - name: CLI smoke and newline check
        shell: pwsh
        run: |
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "cpp\build-msvc\Release\aero1553.exe"
          $psi.Arguments = "--version"
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $out = [System.Diagnostics.Process]::Start($psi).StandardOutput.ReadToEnd()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($out)
          if ($bytes -contains 13) { throw "stdout contained CR: binary mode is not in effect" }
          if ($out.TrimEnd("`n") -ne "aero1553 3.0.0") { throw "unexpected --version output: $out" }

  # ASan (heap/stack overflow, use-after-free), UBSan (undefined behaviour) and
  # LSan (leaks), all fatal on first finding. Modern toolchain only: GCC 4.8 has
  # partial ASan and no LSan at all, which is precisely why the 4.8 tier runs
  # the functional suite instead.
  sanitizers:
    name: ASan + UBSan + LSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-14
      - name: Test under sanitizers
        run: make -C cpp -j"$(nproc)" check SANITIZE=1

  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-14 valgrind
      - name: Build
        run: make -C cpp -j"$(nproc)" all
      # --errors-for-leak-kinds=all: a "still reachable" block at exit is a leak
      # for a short-lived CLI, not a tolerable steady state.
      - name: memcheck
        run: make -C cpp check-valgrind

  coverage:
    name: coverage (gcovr)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install gcovr
        run: pipx install gcovr==8.6
      # Driven through the Makefile target for the same reason cppcheck is: this
      # job and a developer's `make coverage` must be one invocation with one
      # threshold, or the two drift and CI disagrees with the desk.
      #
      # The target rebuilds from clean with instrumentation and runs the FULL
      # Catch2 suite -- coverage measured over a subset is a number about the
      # subset. It does NOT include the conformance suite, which drives the
      # separate CLI binary out-of-process; paths reached only that way are
      # therefore counted as uncovered here, which is the conservative direction.
      - name: Coverage gate
        run: make -C cpp coverage

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cppcheck
      # Driven through the Makefile target so this job and a developer's
      # `make cppcheck` (and the `make verify-ci` pre-push run) are the same
      # invocation with the same suppression list. Spelling the command out here
      # as well is how the two came to differ once already: a tests-only
      # suppression was added to one and would have been missing from the other,
      # so CI and local would have disagreed about a clean tree.
      - name: cppcheck
        run: make -C cpp cppcheck

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The version comes from env.LLVM_VERSION at the top of this file; see the
      # note there for why it is not Ubuntu's clang 18 and why it is pinned in
      # exactly one place per file.
      - name: Add the LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
      - name: Install toolchain
        run: sudo apt-get install -y -qq --no-install-recommends g++-14 "clang-tidy-${LLVM_VERSION}" bear
      # Printed so the log says which analyser produced the findings below. A
      # gate whose version is invisible cannot be reproduced locally.
      - name: Analyser version
        run: "clang-tidy-${LLVM_VERSION} --version"
      # bear intercepts the real build to produce compile_commands.json, so
      # clang-tidy analyses the translation units as they are actually compiled
      # -- same flags, same defines -- rather than a reconstruction of them.
      #
      # This runs from the REPOSITORY ROOT, so compile_commands.json lands beside
      # the repo rather than inside cpp/. clang-tidy finds it by walking upward,
      # and `make tidy`'s tidy-db-check looks in the same places for the same
      # reason. Moving this step's working directory would break both.
      - name: Generate the compilation database
        run: bear -- make -C cpp -j"$(nproc)" all
      - name: clang-tidy
        run: make -C cpp tidy "TIDY=clang-tidy-${LLVM_VERSION}"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The version comes from env.LLVM_VERSION at the top of this file; see the
      # note there for why it is not Ubuntu's clang 18 and why it is pinned in
      # exactly one place per file.
      - name: Add the LLVM apt repository
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
      - name: Install clang-format
        run: sudo apt-get install -y -qq --no-install-recommends "clang-format-${LLVM_VERSION}"
      # Printed for the same reason as the analyser version in the clang-tidy
      # job: clang-format output changes between majors, so a reformat that
      # surprises someone should name the tool that produced it.
      - name: Formatter version
        run: "clang-format-${LLVM_VERSION} --version"
      - name: format-check
        run: make -C cpp format-check "FORMAT=clang-format-${LLVM_VERSION}"

  # The C++ binary against the SHARED oracles in tests/conformance/ -- the same
  # byte-exact expected CSVs the Rust and Python implementations are held to.
  # This is what makes "a third implementation" a claim about output rather than
  # about a build succeeding.
  #
  # `--only cpp` compares against the committed oracles rather than against the
  # other two CLIs, so this job needs no cargo and no installed aero1553. The
  # cases that need the unported merge are skipped BY NAME in the log, so the
  # gap stays visible instead of looking like coverage.
  #
  # Both operating systems, because the platform layer is the part most likely
  # to diverge: the Windows binary opens files, maps them and writes stdout
  # through an entirely different backend.
  cpp-conformance:
    name: Conformance vs shared oracles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      # The oracles are LF. Letting git rewrite them on Windows checkout would
      # fail every case for a reason that has nothing to do with the decoder.
      - name: Normalize git line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-14 make
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make -C cpp -j"$(nproc)" all
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B cpp/build-msvc -S cpp -G "Visual Studio 17 2022" -A x64
          cmake --build cpp/build-msvc --config Release
      # Linux lets run.py ask the Makefile where the binary went; the MSVC
      # layout is fixed by the generator, so it is named directly.
      - name: Run conformance (Linux)
        if: runner.os == 'Linux'
        run: python tests/conformance/run.py --only cpp
      - name: Run conformance (Windows)
        if: runner.os == 'Windows'
        run: python tests/conformance/run.py --only cpp --cpp-bin cpp/build-msvc/Release/aero1553.exe

  # The differential checks, over ALL THREE implementations at once.
  #
  # This job exists because neither of the others can run them. `conformance` in
  # ci.yml passes `--skip cpp`, and `cpp-conformance` above passes `--only cpp`
  # -- and a differential check needs something to differ FROM, so with one
  # implementation selected it skips itself. Without this job the three-way
  # contract would have been checked by nothing at all, while every gate stayed
  # green.
  #
  # It is worth its cost. The first three-way run found two real divergences the
  # per-implementation suites could not: the C++ build could not open ANY file
  # at a non-ASCII path on Windows, and it collapsed three distinct config-path
  # failures into one diagnostic.
  #
  # Ubuntu only, deliberately. The cases this adds over the Windows runs are the
  # POSIX ones -- a character device as a config path, a symlink to a real one --
  # which Windows skips.
  # cross-impl-differential MOVED to .github/workflows/differential.yml.
  #
  # It was the only job that runs all three implementations together -- and so
  # the only one that can run the differential config checks -- but it sat in
  # THIS workflow, which is filtered to `cpp/**`. The check written to catch a
  # divergence between implementations therefore only ran when the C++ tree
  # changed. It now runs unfiltered, on every push and pull request.

  # The three invariants that make the portability argument true rather than
  # aspirational. Cheap enough to share one job.
  invariants:
    name: Platform confinement, locale, source-list agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # cmake is needed by assert-sources-agree.sh, which configures the real
      # CMakeLists and asks it what it resolved -- comparing the two builds'
      # actual output rather than re-implementing the parsing and comparing the
      # build against a copy of itself.
      - name: Install cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake
      - name: OS headers are confined to the platform backends
        run: bash scripts/assert-platform-confined.sh
      - name: No locale-sensitive parsing or formatting
        run: bash scripts/assert-locale-free.sh
      - name: The Makefile and CMake resolve the same sources
        run: bash scripts/assert-sources-agree.sh
