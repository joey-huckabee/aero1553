name: Cross-implementation differential

# THE ONLY JOB THAT RUNS ALL THREE IMPLEMENTATIONS TOGETHER.
#
# It lives in its own workflow, with NO path filter, and that is the entire
# point of the file. It used to sit in cpp-ci.yml, which is filtered to
# `cpp/**` -- so the one check capable of catching a divergence BETWEEN
# implementations only ran when the C++ tree changed. A Rust or Python change
# that introduced a config-parser divergence would not have been caught by the
# check written to find exactly that.
#
# What only this job can do:
#
#   * Run the conformance manifest with NO --only / --skip. The runner defaults
#     to every registered implementation and FAILS if one is missing, so a
#     silently-absent implementation is an error rather than a smaller pass.
#   * Run the differential config-parser checks (config_parity, config_fuzz,
#     config_path_parity). Each takes an implementation-to-CLI mapping and
#     compares ALL PAIRS; with fewer than two implementations selected they
#     skip themselves. ci.yml passes `--skip cpp` and cpp-ci.yml passes
#     `--only cpp`, so in both of those the checks skip.
#   * Run the CLI surface-parity gate across all three.
#
# Its first run, when it was introduced, found two real divergences. That is
# the reason it exists and the reason it must not be gated behind one
# implementation's path filter.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: differential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-impl-differential:
    name: Differential checks (all three implementations)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `-e` rather than the locked uv environment: this job compares CLI
      # BEHAVIOUR across implementations and does not need pinned dependency
      # versions, only an importable package.
      # `pytest` explicitly: `-e ./python` installs the package's runtime
      # requirements, not its dev group, and the fuzz-summary step below runs
      # the Python harnesses directly.
      - name: Install the Python package
        run: python -m pip install -e ./python pytest

      - name: Install the C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++-14 make

      - name: Build the C++ decoder
        run: make -C cpp -j"$(nproc)" all

      # No --only / --skip: the runner defaults to every registered
      # implementation and fails if one is missing, which is exactly what this
      # job wants to assert. The Rust binary is built by the runner itself if
      # it is not already present.
      #
      # This also runs `record_fuzz.py`, the differential RECORD-STREAM fuzzer:
      # it generates recordings from the committed fixtures, damages them, and
      # compares the CSV bytes all-pairs. That is the only check anywhere that
      # compares what the three DECODERS produce on inputs nobody wrote.
      - name: Conformance, surface parity, and the differential fuzzers
        run: python tests/conformance/run.py

      # The per-implementation L1-ROB-001 harnesses each prove their own process
      # did not crash. Their FUZZ-SUMMARY counters are defined to mean the same
      # thing in all three, and comparing them is what turns "three
      # implementations each survived" into "three implementations agreed".
      #
      # It runs HERE, on every push, and not only in the nightly burn-in: a PR
      # that introduced a divergence would otherwise stay green until the next
      # scheduled run. Default iteration counts, so this costs seconds.
      - name: Run every fuzz harness into one summary file
        env:
          MIE_FUZZ_SUMMARY: ${{ github.workspace }}/fuzz-summaries/all/summary.txt
        run: |
          mkdir -p fuzz-summaries/all
          (cd rust && cargo test --locked --test integration -- \
              fuzz_arbitrary_bytes_never_panic \
              dump_arbitrary_bytes_never_panics \
              merge_input_resolution_tolerates_arbitrary_bytes)
          # From `python/`, because the harnesses import `tests.fuzz_support`
          # and that resolves against the rootdir pytest picks from
          # `python/pyproject.toml`.
          (cd python && python -m pytest tests/test_e2e.py::TestFuzzHarness \
              tests/test_merge.py::test_merge_input_resolution_tolerates_arbitrary_bytes \
              -q)
          make -C cpp check-fuzz

      - name: Compare the summaries across implementations
        run: python scripts/compare-fuzz-summaries.py fuzz-summaries
