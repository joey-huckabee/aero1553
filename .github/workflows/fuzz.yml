name: Fuzz burn-in

# Deeper run of the L1-ROB-001 no-panic harnesses than the ordinary suites do.
# The normal `ci.yml` runs take the fixed 256-iteration default; this workflow
# overrides MIE_FUZZ_ITERATIONS for a much larger sweep. The generator is
# deterministic, so a burn-in is a strict superset of the default run (same
# first 256 inputs) and a failure reproduces from the printed seed against
# either implementation.
#
# THE JOBS ARE SCOPED TO BE COMPARABLE. That is the point of the file and it
# was not always true. Each implementation's harness used to run under its own
# framework, at its own scope, reporting its own shape of result -- Rust
# printed "1 passed", Python "2 passed", and the former C++ tree "484 test
# cases". Jobs proving "did not crash" different ways cannot be diffed against
# each other, and a deterministic shared generator is wasted if nothing
# compares the results.
#
# So, in order:
#
#   * every job runs ONLY its fuzz harnesses,
#   * every harness reads the SAME three environment variables,
#   * every harness ends by writing one FUZZ-SUMMARY line of counters that are
#     defined to mean the same thing in both implementations, and
#   * `fuzz-compare` downloads all of them and fails if any two disagree.
#
# WHY WINDOWS IS IN THE MATRIX. Mapping a file is the first thing every one of
# these harnesses does with its garbage input, and Rust's and Python's
# memory-mapping paths differ by platform. `ci.yml` already builds and tests
# both on Windows, but only ever at the 256-iteration default.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Fuzz iterations per implementation"
        default: "25000"
      stream_logs:
        description: "Stream harness WARN/ERROR diagnostics into the job log"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIE_FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '25000' }}
  # Replaces the former `--nocapture` / `-s` knobs, which did not work. Rust's
  # logger writes through `std::io::stderr()` and libtest's capture only
  # intercepts the `print!` / `eprint!` macros. So the Rust job (and the former
  # C++ one) streamed its diagnostics unconditionally -- tens of megabytes into
  # every scheduled run -- while pytest captured Python's and showed nothing at
  # all. Neither job was
  # answering the question the input claimed to ask. Silencing is now the
  # harness's job, and this variable is what asks it not to.
  MIE_FUZZ_STREAM_LOGS: ${{ github.event.inputs.stream_logs == 'true' && '1' || '0' }}

jobs:
  fuzz-rust:
    name: Rust fuzz burn-in (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      MIE_FUZZ_SUMMARY: ${{ github.workspace }}/fuzz-summary.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      # Each harness runs as its own step so the Actions UI shows pass/fail and
      # duration per harness -- the granularity the other jobs lacked.
      - name: Reader fuzz harness (burn-in)
        working-directory: rust
        run: cargo test --locked --test integration fuzz_arbitrary_bytes_never_panic

      - name: Dump fuzz harness (burn-in)
        working-directory: rust
        run: cargo test --locked --test integration dump_arbitrary_bytes_never_panics

      - name: Merge input-resolution fuzz harness (burn-in)
        working-directory: rust
        run: cargo test --locked --test integration merge_input_resolution_tolerates_arbitrary_bytes

      - name: Show summary
        shell: bash
        run: cat "$MIE_FUZZ_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-summary-rust-${{ matrix.os }}
          path: fuzz-summary.txt
          if-no-files-found: error

  fuzz-python:
    name: Python fuzz burn-in (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MIE_FUZZ_SUMMARY: ${{ github.workspace }}/fuzz-summary.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      # TestFuzzHarness holds both the reader and dump harnesses. `-s` so the
      # harnesses' own stderr (the summary line, and the decoder diagnostics
      # when MIE_FUZZ_STREAM_LOGS is set) reaches the job log the way Rust's
      # already does -- pytest is the only harness runner whose capture
      # actually intercepts them.
      - name: Run the L1-ROB-001 fuzz harnesses (burn-in)
        run: >
          uv --directory python run pytest
          tests/test_e2e.py::TestFuzzHarness
          tests/test_merge.py::test_merge_input_resolution_tolerates_arbitrary_bytes
          -v -s

      - name: Show summary
        shell: bash
        run: cat "$MIE_FUZZ_SUMMARY"

      - name: Upload summary
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-summary-python-${{ matrix.os }}
          path: fuzz-summary.txt
          if-no-files-found: error

  fuzz-compare:
    name: Cross-implementation summary comparison
    runs-on: ubuntu-latest
    needs: [fuzz-rust, fuzz-python]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download every job's summary
        uses: actions/download-artifact@v6
        with:
          pattern: fuzz-summary-*
          path: fuzz-summaries

      # The only step in this workflow that can catch a divergence BETWEEN
      # implementations. Everything above proves that one implementation did not
      # crash; this proves they agreed on what they read. All-pairs, no
      # reference implementation -- see the script's header and
      # tests/conformance/differential.py for why.
      - name: Compare
        run: python scripts/compare-fuzz-summaries.py fuzz-summaries
