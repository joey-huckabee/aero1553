# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

# 1. Login to SonarCloud.io using your GitHub account

# 2. Import your project on SonarCloud
#     * Add your GitHub organization first, then add your repository as a new project.
#     * Please note that many languages are eligible for automatic analysis,
#       which means that the analysis will start automatically without the need to set up GitHub Actions.
#     * This behavior can be changed in Administration > Analysis Method.
#
# 3. Follow the SonarCloud in-product tutorial
#     * a. Copy/paste the Project Key and the Organization Key into the args parameter below
#          (You'll find this information in SonarCloud. Click on "Information" at the bottom left)
#
#     * b. Generate a new token and add it to your Github repository's secrets using the name SONAR_TOKEN
#          (On SonarCloud, click on your avatar on top-right > My account > Security
#           or go directly to https://sonarcloud.io/account/security/)

# Feel free to take a look at our documentation (https://docs.sonarcloud.io/getting-started/github/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/help/sc/9)

# The scanner arguments (sources, tests, exclusions, Rust LCOV + Python XML
# coverage paths) live in the "Analyze with SonarCloud (runner)" step below.
# projectKey / organization / token come from repository secrets — see the
# Setup notes below; nothing is hardcoded to a specific org here.
#
# Setup (one-time, per the SonarCloud onboarding tutorial):
#   1. On SonarCloud, add your GitHub org and import this repo as a project.
#   2. Administration > Analysis Method: turn OFF "Automatic Analysis"
#      (it conflicts with this CI-based scan and will reject the upload).
#   3. Add repo secrets: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION.
# Until those secrets exist, every analysis step is skipped (safe no-op).
name: Analyze with SonarCloud

on:
  # Manual trigger
  workflow_dispatch:

  # Run on PRs targeting main
  pull_request:
    branches: [ main ]

  # Run on Pushes targeting main
  push:
    branches: [ main ]

  # Weekly scheduled scan (Monday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 1'

# ------------------------------------------------------------------------------
# Permissions
# ------------------------------------------------------------------------------
# contents: read        → required to clone repository
# pull-requests: read   → allows SonarCloud PR decoration
# NOTE: security-events: write is implicitly required for SARIF upload
#       (GitHub enables it automatically for codeql-action/upload-sarif)
permissions:
  contents: read
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results
  security-events: write  # Needed to upload SARIF results to GitHub

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    # ----------------------------------------------------------------------------
    # Environment variables (from repository secrets)
    # ----------------------------------------------------------------------------
    env:
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)

    steps:
      # --------------------------------------------------------------------------
      # Verify required SonarCloud secrets are present (safe logging)
      # --------------------------------------------------------------------------
      - name: Check Sonar secrets (safe)

        run: |
          test -n "$SONAR_ORGANIZATION" && echo "SONAR_ORGANIZATION is set" || echo "SONAR_ORGANIZATION is NOT set"
          test -n "$SONAR_PROJECT_KEY" && echo "SONAR_PROJECT_KEY is set" || echo "SONAR_PROJECT_KEY is NOT set"
          test -n "$SONAR_TOKEN" && echo "SONAR_TOKEN is set" || echo "SONAR_TOKEN is NOT set"

      # --------------------------------------------------------------------------
      # Checkout repository source code
      # fetch-depth: 0 ensures full git history for Sonar analysis
      # --------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------------------------------
      # Install Rust toolchain (stable) with LLVM tools for coverage support.
      # This repo pins no rust-toolchain file; it tracks stable (MSRV 1.88).
      # ---------------------------------------------------------------------------
      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # --------------------------------------------------------------------------
      # Install cargo-llvm-cov (pinned to match .github/workflows/ci.yml)
      # Used to generate LCOV coverage data for SonarCloud
      # --------------------------------------------------------------------------
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6

      # --------------------------------------------------------------------------
      # Cache Cargo dependencies and build artifacts (crate lives under rust/)
      # Speeds up subsequent workflow runs
      # --------------------------------------------------------------------------
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-sonar-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sonar-

      # --------------------------------------------------------------------------
      # Generate Rust code coverage in LCOV format (consumed by SonarCloud).
      # The crate lives under rust/, so run there; the cov-lcov alias in
      # rust/.cargo/config.toml writes rust/lcov.info and excludes the bin shim,
      # matching the coverage gate in ci.yml.
      # --------------------------------------------------------------------------
      - name: Rust coverage (LCOV)
        working-directory: rust
        run: cargo cov-lcov

      # --------------------------------------------------------------------------
      # Python coverage (Cobertura XML) for SonarCloud — mirrors the ci.yml
      # Python setup. Writes python/coverage.xml (paths resolve under the
      # checkout, so SonarCloud maps them to python/src/...).
      # --------------------------------------------------------------------------
      # uv provisions the interpreter too (python-version sets UV_PYTHON), and
      # its version is pinned, so a uv release cannot
      # change a gate's behaviour unattended.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml rather
      # than silently re-resolving. The sync also compiles the PyO3 extension
      # (python/native) with the runner's preinstalled Rust stable.
      - name: Synchronize locked dependencies
        run: uv --directory python sync --locked

      - name: Python coverage (XML)
        run: uv --directory python run pytest --cov --cov-report=xml   # -> python/coverage.xml

      # --------------------------------------------------------------------------
      # C++ analysis input
      # --------------------------------------------------------------------------
      # Sonar's CFamily analyser cannot read C++ from source alone -- it needs to
      # know how each translation unit is actually compiled. Two ways exist: the
      # build-wrapper, or a compilation database. This uses the database, because
      # the repository already produces one with `bear` for clang-tidy, so the
      # analyser sees exactly the flags the real build uses rather than a second
      # description of the build that could drift from `sources.txt`.
      - name: Install C++ build tooling
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends g++ make bear

      # Run from `cpp/`, NOT `bear -- make -C cpp ...` from the root: bear writes
      # compile_commands.json into its own working directory, so `-C` puts the
      # database at the repository root while the scanner looks for it beside the
      # sources. This is also the exact command cpp/README.md documents, so the
      # CI invocation and the local one cannot drift.
      - name: Build C++ with a compilation database
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        working-directory: cpp
        run: bear -- make -j"$(nproc)" all   # -> cpp/compile_commands.json

      # C++ COVERAGE FOR SONAR.
      #
      # Adding cpp/src and cpp/include as sources without this made Sonar count
      # all 66 C++ files as ZERO-covered, which dropped new_coverage to 51.7%
      # against an 80% gate and turned `main` red -- a self-inflicted failure
      # that had nothing to do with the code.
      #
      # A SEPARATE build from the one above: this tier is -O0 with --coverage
      # and keys its own BUILD_DIR, so it cannot clobber the compilation
      # database the CFamily analyser reads.
      #
      # `--sonarqube` is gcovr's native emitter for SonarQube's generic coverage
      # XML, so no format conversion sits between the measurement and the gate.
      # gcovr runs FROM THE REPOSITORY ROOT, not from cpp/. The emitted paths
      # must be repo-relative (`cpp/src/reader.cpp`) because Sonar resolves them
      # against its project base dir. Run from cpp/ they come out as
      # `src/reader.cpp`, Sonar matches no file, and coverage silently stays at
      # zero while every step reports success. Verified locally before pushing,
      # which is the only reason this says `--root .` with a `cpp` search path.
      #
      # The two asserts below exist because that failure is silent: an empty or
      # wrongly-rooted report is indistinguishable from a passing one at the
      # step level, and would show up only as an unexplained coverage drop.
      - name: C++ coverage report for Sonar
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          pipx install gcovr==8.6
          make -C cpp -j"$(nproc)" check COVERAGE=1
          gcovr --root . \
            --filter 'cpp/src/' \
            --exclude 'cpp/src/main\.cpp' \
            --exclude 'cpp/src/platform_win32\.cpp' \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --sonarqube cpp/coverage-sonar.xml \
            cpp
          test -s cpp/coverage-sonar.xml
          grep -q 'path="cpp/src/' cpp/coverage-sonar.xml

      # --------------------------------------------------------------------------
      # Install SonarScanner CLI (runs on the runner, can access cargo/clippy)
      # --------------------------------------------------------------------------
      # Look for newer versions here https://binaries.sonarsource.com/?prefix=Distribution/sonar-scanner-cli/
      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner.zip
          SCANNER_DIR=$(find . -maxdepth 1 -type d -name "sonar-scanner-*")
          echo "$RUNNER_TEMP/$SCANNER_DIR/bin" >> $GITHUB_PATH

      # --------------------------------------------------------------------------
      # Verify SonarScanner has been installed correctly
      # --------------------------------------------------------------------------
      - name: Verify SonarScanner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        run: sonar-scanner --version

      # --------------------------------------------------------------------------
      # Run SonarScanner (runner)
      # Wait for SonarCloud Quality Gate if push to main (default branch)
      # Uploads code, metrics, coverage, and issues to SonarCloud
      # --------------------------------------------------------------------------
      - name: Analyze with SonarCloud (runner)
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != '' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          # Wait for (and fail on) the Quality Gate on PRs as well as on pushes
          # to the default branch. Waiting only on main is what let a failing
          # gate ship: a PR's "SonarCloud Code Analysis" check reported success
          # for merely uploading the scan, so #70, #71, #72 and #73 all merged
          # green and only turned the main branch red afterwards. The gate is
          # now enforced before merge, where it can still be acted on.
          SONAR_QG_WAIT: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
          # Used below to decide whether this run must label itself as a
          # non-default branch. Read from the repository rather than hard-coded
          # so renaming the default branch does not silently break the guard.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The declared release version, so the "Previous version" new-code
          # definition restarts at each release. Without it every analysis
          # reported the same (absent) version, and "new code" silently meant
          # "everything since the project's first analysis".
          version="$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)"
          args=(
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
            "-Dsonar.organization=${SONAR_ORGANIZATION}"
            "-Dsonar.projectVersion=${version}"
            # SonarCloud has no UI setting for the display name; an analysis
            # parameter is the only way to set it, and it applies on the next
            # main-branch scan. Pinned here so the name lives in code.
            "-Dsonar.projectName=Aero1553"
            "-Dsonar.sources=rust/src,python/src,cpp/src,cpp/include"
            "-Dsonar.tests=rust/tests,python/tests,tests/conformance,cpp/tests"
            # cpp/third_party is vendored Catch2 (BSL-1.0) -- not ours to fix,
            # and it would dominate the finding count. cpp/build is per-toolchain
            # object output.
            "-Dsonar.exclusions=rust/target/**,rust/.cargo/**,python/dist/**,**/__pycache__/**,docs/**,tests/conformance/inputs/**,tests/conformance/expected/**,.github/**,sonar-scanner*.zip,sonar-scanner-*/**,cpp/third_party/**,cpp/build/**,cpp/build-*/**"
            # The database `bear` wrote above. Without this the C++ files are
            # collected but never analysed, which reads as "clean" rather than
            # as "not run" -- the same shape of silent pass this repository has
            # been bitten by twice (the vacuous diagrams job, the compile-DB
            # probe with container paths).
            "-Dsonar.cfamily.compile-commands=cpp/compile_commands.json"
            "-Dsonar.coverageReportPaths=cpp/coverage-sonar.xml"
            "-Dsonar.rust.lcov.reportPaths=rust/lcov.info"
            "-Dsonar.rust.clippy.enabled=false"
            "-Dsonar.python.version=3.10"
            "-Dsonar.python.coverage.reportPaths=python/coverage.xml"
            # pythonsecurity:S8707 ("Agentic workflows should not be vulnerable
            # to path injection") fires on `--config <path>` reaching
            # `Path.read_text()` in config.py. It is a false positive for this
            # program shape: aero1553 is an operator-run CLI, the config path
            # IS the interface, and the process holds exactly the permissions of
            # the user who typed the command — there is no sandbox to escape and
            # no privilege boundary to cross. The rule's premise (an agent
            # escaping filesystem restrictions) presumes a confinement this tool
            # does not have and does not claim.
            #
            # The read-safety hardening that WAS warranted is implemented and
            # kept: config.py requires a *regular file* before reading, so
            # `--config <dir>` and `--config /dev/zero` are rejected rather than
            # raising IsADirectoryError or hanging (see load_config).
            #
            # Scoped to the one rule in the one file so any other finding there,
            # and this rule anywhere else, still fails the build.
            #
            # The operator-facing statement of the same decision lives in
            # docs/CONFIG-REFERENCE.md "Trust boundary". Keep the two in step.
            # ----------------------------------------------------------------
            # reader.py: the manifest-contents taint flow (S2083 + S8707)
            # ----------------------------------------------------------------
            #
            # Both fire on the `open(self._path, "rb")` in reader.py. The
            # ROADMAP entry that deferred these described them as the CLI input
            # path being operator-supplied; the actual taint flow SonarCloud
            # reports says otherwise, and the difference matters:
            #
            #   merge.py:58    Source: the CONTENTS of a --manifest file
            #   merge.py:60-61 -> line -> trimmed
            #   cli.py:637     -> paths
            #   cli.py:1131    -> input_paths
            #   reader.py:240  -> open()
            #
            # So the tainted value is not the argument the operator typed. It is
            # each line of the manifest file the operator pointed at. The
            # justification is therefore NOT the config.py one ("the path is the
            # interface") but a narrower claim: a manifest's contents are exactly
            # as trusted as the operator who chose that manifest. Reading the
            # files it lists is the documented purpose of --manifest
            # (L2-MRG-001), the process holds precisely the permissions of the
            # user who ran it, and the decoder only reads those files and writes
            # the CSV that same user asked for. There is no privilege boundary
            # being crossed and no sandbox to escape; S8707's premise of an agent
            # escaping filesystem restrictions presumes a confinement this tool
            # does not have and does not claim.
            #
            # Someone who can write the manifest can already run the decoder with
            # any argument they like, so the flow adds no capability.
            #
            # PRECEDENT. S8707 on this SAME flow is already resolved Won't Fix at
            # merge.py:58 (the source itself), dump.py:70 and dump.py:119. These
            # two are the same judgement on the same flow, recorded in the
            # repository rather than only in SonarCloud so it survives for
            # someone reading the source.
            #
            # ----------------------------------------------------------------
            # merge.py: the same flow, at its SOURCE
            # ----------------------------------------------------------------
            #
            # S8707 fires again on `read_manifest`, which is where the taint
            # the reader.py entry above describes actually enters: the CONTENTS
            # of a --manifest file. The justification is identical and is
            # written out there -- a manifest's contents are exactly as trusted
            # as the operator who chose that manifest, and reading the files it
            # lists is the documented purpose of --manifest (L2-MRG-001).
            #
            # WHY IT IS HERE NOW AND WAS NOT BEFORE. It was resolved Won't Fix
            # in SonarCloud against merge.py:58. v2.16.0 rewrote that function
            # to open the stream with `newline=""` (the manifest grammar fix),
            # the line moved, and the finding came back as NEW code -- failing
            # a gate on a judgement that had already been made. That is exactly
            # the failure mode the comment above warns about: a resolution that
            # lives only in SonarCloud does not survive the code being edited.
            # Recording it here makes it survive.
            # This is the first S2083 suppression in this repository, taken
            # deliberately rather than as a step in a release -- which is what
            # docs/ROADMAP.md asked for. Both entries stay scoped to one rule in
            # one file: any other finding in reader.py, and either rule anywhere
            # else, still fails the build.
            # ----------------------------------------------------------------
            # dump.py: pythonsecurity:S8707, the `dump` input path
            # ----------------------------------------------------------------
            #
            # Fires on `fpath.read_bytes()` in hex_dump_raw and
            # hex_dump_records. The path is the positional argument of
            # `aero1553 dump`, and reading that file is the whole of what the
            # subcommand does -- the config.py judgement above, on the one other
            # file that reads an operator-named path.
            #
            # WHY IT IS HERE NOW. This was the "dump.py:70 and dump.py:119"
            # Won't Fix cited as precedent in the reader.py entry. It lived only
            # in SonarCloud, and the v4.0.0 rename replaced the SonarCloud
            # project, so it came back with every other UI-only resolution.
            # Same lesson as merge.py, taken a second time: record it here.
            # ----------------------------------------------------------------
            # config.hpp: cpp:S1820 "no more than 20 fields"
            # ----------------------------------------------------------------
            #
            # DecoderConfig and ConfigOverrides carry one field per config key
            # (23 each). Reason (a) of BATCH 4 below: they mirror Rust's
            # `config::DecoderConfig` / `ConfigOverrides` field for field, and
            # the flat shape IS the schema -- `with_overrides` is a key-by-key
            # merge that reads as a list precisely because the struct is one.
            # Regrouping into sub-structs in C++ alone would make the three
            # config layers disagree on shape for no behavioural gain.
            # ----------------------------------------------------------------
            # dump.cpp: cpp:S2083 "tainted value 'text' is leaking"
            # ----------------------------------------------------------------
            #
            # Fires on the `std::fwrite` inside `emit()`. The taint source is the
            # operator-named input file, and the sink is STDOUT -- which is the
            # entire purpose of `aero1553 dump`: render the bytes of the file
            # the operator asked about.
            #
            # S2083 is path injection. There is no path here. `emit()` writes to
            # an already-open `FILE*`; the tainted value is the report TEXT, not
            # a filename, and it reaches no filesystem call, no shell and no
            # interpreter. A rule about choosing a path by untrusted input has
            # matched a function that chooses nothing.
            #
            # Same adjudication as the reader.py/config.py entries above and for
            # the same reason: this is an operator-run CLI holding exactly the
            # permissions of the user who typed the command. Scoped to the one
            # rule in the one file, so this rule anywhere else -- and any other
            # finding in dump.cpp -- still fails the build.
            #
            # ----------------------------------------------------------------
            # platform_posix.cpp: cpp:S2612 "permissions granted to others"
            # ----------------------------------------------------------------
            #
            # Fires on `::open(candidate, O_WRONLY|O_CREAT|O_EXCL, 0644)` in the
            # atomic-write path. Two reasons this stays:
            #
            # 1. 0644 is the MODE ARGUMENT, not the resulting mode -- the umask
            #    still applies. It is also stricter than what the other two
            #    implementations request: Rust's `File::create` passes 0666 and
            #    Python's `open(...,"w")` does the same. Tightening C++ to 0600
            #    would make the three implementations emit output files with
            #    DIFFERENT permissions from the same input, which is exactly the
            #    kind of cross-implementation divergence this repository exists
            #    to prevent.
            # 2. The temp file becomes the operator's CSV via rename. A decoded
            #    recording is not a secret relative to the recording it came
            #    from, and a 0600 output would break the ordinary case of a CSV
            #    read by another user or a downstream service.
            #
            # If output permissions ever need to be restricted, that is a
            # deliberate feature decision across all three implementations with
            # a documented flag -- not a silent change in one backend.
            # ----------------------------------------------------------------
            # cpp/**: cpp:S3230 "use the in-class initializer instead"
            # ----------------------------------------------------------------
            #
            # S3230 has two distinct messages behind one rule key. The first --
            # "it is redundant with default initialization behavior" -- was a
            # real cleanup and is FIXED: 100 lines of redundant entries removed,
            # applied by clang-tidy's readability-redundant-member-init because
            # that check distinguishes a redundant `std::string s()` from a
            # LOAD-BEARING `int n()`, and Sonar's message does not.
            #
            # The second message prescribes a default member initializer, and
            # that is the one suppressed here. In C++11 a class with an NSDMI is
            # NOT AN AGGREGATE, so adopting them tree-wide would make
            # `Foo{1, 2}` ill-formed on GCC 4.8.5 -- the SLES 12 system compiler
            # this implementation exists to support (ADR-0001). MSVC compiles as
            # C++14, where the same code is legal, so the breakage would appear
            # only on the target platform and only at the fidelity tier. That
            # exact hazard is why CONTRIBUTING.md names "aggregate-initialising a
            # class with a default member initializer" as one of two banned
            # constructs.
            #
            # Coverage of the useful half is not lost: clang-tidy's
            # readability-redundant-member-init runs in the clang-tidy gate at
            # LLVM 20 and will catch a newly redundant entry. Sonar's rule key
            # cannot be suppressed per-message, so suppressing it wholesale and
            # keeping the sharper tool is the trade.
            # ----------------------------------------------------------------
            # reader.cpp: cpp:S1905 "remove this redundant cast"
            # ----------------------------------------------------------------
            #
            # The cast is NOT redundant -- it is load-bearing on the shipping
            # Windows build, and the comment above it says so:
            #
            #   GCC is quiet about it here; MSVC compiles at /W4 /WX, where
            #   C4244 makes it an error -- green on Linux, broken on the
            #   Windows build.
            #
            # SonarCloud analyses this tree on Linux, so it sees only the half
            # of the story where the cast is unnecessary. Acting on the finding
            # would break MSVC, which is a shipping target (ADR-0003), and the
            # breakage would not appear in the analysis that suggested it.
            #
            # ----------------------------------------------------------------
            # decode.hpp: cpp:S125 "remove the commented out code"
            # ----------------------------------------------------------------
            #
            # The line is a section banner:
            #
            #   // --- Timestamp-format auto-detection (L2-DEC-015 / L2-DEC-016) ---
            #
            # A requirement id in a dashed rule reads as commented-out code to
            # the heuristic. The header uses these banners throughout to group
            # declarations against the requirements they implement, which is a
            # navigation aid, not a leftover.
            # ----------------------------------------------------------------
            # cpp/**: cpp:S5566 "change this raw for-loop to a range for-loop"
            # ----------------------------------------------------------------
            #
            # SUPPRESSED BECAUSE SATISFYING IT FAILS A REQUIRED GATE. This was
            # attempted, with clang-tidy's modernize-loop-convert applying all
            # 39, and the result was reverted. Converting an index loop to a
            # range-for is exactly the shape cppcheck's `useStlAlgorithm`
            # matches, so cppcheck -- which runs with --error-exitcode=1 and
            # blocks the merge -- then demanded that a dozen plain loops be
            # rewritten as std::transform / std::any_of / std::find_if with
            # lambdas. Each round of that surfaced more:
            #
            #   round 1  clang-tidy 20 misc-const-correctness x11 (every
            #            generated element was non-const; the check does not
            #            exist before LLVM 15, so clang-tidy 14 was silent)
            #   round 2  a compile error from an incomplete rename
            #   round 3  cppcheck internalAstError -- modernize-use-equals-default
            #            had re-applied the `throw() = default` that an earlier
            #            batch reverted for cppcheck's sake
            #   round 4  cppcheck constVariablePointer + useStlAlgorithm x14
            #
            # Two analysers hold opposite opinions about the same code. S5566 is
            # MINOR; cppcheck blocks the merge. Rewriting readable loops as
            # algorithm calls with lambdas is a legibility trade this project
            # has not chosen, and it is not worth making to satisfy a MINOR rule
            # that a required gate then rejects.
            #
            # The C++11 floor is a factor too: no structured bindings, no
            # ranges, and lambdas that would carry the loop body are the whole
            # of the readability cost with none of the modern compensations.
            # ================================================================
            # BATCH 4: the architectural remainder.
            # ================================================================
            #
            # 4 of these 89 findings were fixed; the rest are recorded here with
            # the reason each is not a defect in this tree. That ratio is the
            # honest outcome of working down a list until only the judgement
            # calls remain -- and suppressing them is what makes the count
            # ACTIONABLE: a new finding stands out against zero, not against 89.
            #
            # Three of the reasons recur, so they are stated once:
            #
            #   (a) CROSS-IMPLEMENTATION CONTRACT. The three implementations are
            #       held to one shared design. A C++-only change to a shape the
            #       Rust and Python ones also carry breaks that, whatever its
            #       local merit.
            #   (b) C++11 / GCC 4.8.5 FLOOR (ADR-0001). The SLES 12 system
            #       compiler is the target, not a fallback.
            #   (c) THE C API SAYS SO. The platform layer calls POSIX; POSIX
            #       signatures are not negotiable from inside it.
            #
            # ---- Deferred modernisations, NOT rejections -------------------
            #
            # cpp:S2807 (18) hidden friends, and cpp:S3642 (16) `enum class`.
            # Both are real improvements and neither is being argued against.
            # S3642 is blocked on (a): the enums carry WIRE VALUES and are used
            # as integers throughout, mirroring Rust's `#[repr(u8)]` and Python's
            # IntEnum. `enum class` removes the implicit conversion, so adopting
            # it means casts at every use and a C++-only divergence from a shape
            # the other two share. S2807 is a broad reshuffle of operator
            # overloads with no behavioural effect. Both are recorded in
            # docs/ROADMAP.md so suppressing them here does not lose them.
            #
            # ---- Design decisions this repository has already made ---------
            #
            # cpp:S5945 (12) C-style arrays. Two shapes: `DataWords`' inline
            #   `uint16_t buf_[32]`, which CLAUDE.md protects by name because the
            #   32-word cap is a property of MIL-STD-1553B and the inline buffer
            #   is what keeps the per-record path allocation-free; and static
            #   lookup tables, where a `std::vector` would move a compile-time
            #   constant to the heap.
            # cpp:S5028 (8) `MIE_LOG_MODULE`. Defined per translation unit and
            #   consumed INSIDE another macro, so it cannot be a constant.
            # cpp:S5421 (3) mutable globals: a settable log level, a
            #   test-injectable sink, a temp-name counter. Mutable by design,
            #   each with its rationale written at the definition.
            # cpp:S8417 (3) `memory_order_relaxed` on the log level. A standalone
            #   flag synchronising nothing else is the textbook case where
            #   relaxed is correct; seq_cst would add fences on the per-record
            #   path to no end.
            # cpp:S1709 (2) `Optional`'s implicit constructors, already carrying
            #   NOLINT and cppcheck-suppress with the reasoning at the two lines.
            # cpp:S5205 (1) a captureless function pointer for the log sink
            #   rather than std::function -- documented at the declaration.
            # cpp:S3624 (1) `RecordIter` owns nothing, so it needs no destructor.
            # cpp:S886 (1) a TOML escape scanner that must look ahead one
            #   character; the index is the point.
            # cpp:S1181 / S2486 / S2738 (3) deliberate catch sites: a top-level
            #   CLI backstop that exists so a ConfigError cannot abort the
            #   process, and two catch-alls that flush buffered rows before
            #   re-raising. Two already carry NOLINT.
            # cpp:S107 / S3776 / S924 (10) parameter counts, cognitive complexity
            #   and nested breaks. Same judgement recorded for Rust's
            #   `too_many_lines` and `cognitive_complexity`: these are exhaustive
            #   dispatch tables and record-shape walkers, read by lookup rather
            #   than top to bottom.
            #
            # ---- The C API leaves no choice -------------------------------
            #
            # cpp:S3630 / S5008 (3) `reinterpret_cast` and `void*` in the fd
            #   encoding. `platform.hpp` presents ONE opaque handle type across a
            #   POSIX `int` and a Windows `HANDLE`; `void*` is that type.
            # cpp:S859 (1) `const_cast` for `munmap`, which takes `void*` while
            #   the mapping is held as `const uint8_t*`. Unmapping writes nothing.
            # cpp:S1231 (1) `free` on `realpath(path, nullptr)`, which allocates
            #   with malloc. `delete` there is undefined behaviour.
            #
            # ---- Blocked by a tool this repository must keep green ---------
            #
            # cpp:S3490 (2) `= default` on the two `throw()` destructors.
            #   cppcheck 2.13 cannot parse `throw() = default` and reports
            #   internalAstError, degrading its analysis of the whole file.
            #   Attempted twice, reverted twice; the sites carry NOLINT now.
            "-Dsonar.issue.ignore.multicriteria=agenticPathInjection,readerPathInjection,readerAgenticPathInjection,mergeAgenticPathInjection,dumpAgenticPathInjection,cppConfigFieldCount,dumpEmitTaint,tempFilePermissions,cppMemberInitNsdmi,readerMsvcCast,decodeSectionBanner,cppRawForLoop,cppHiddenFriend,cppEnumClass,cppCArray,cppLogModuleMacro,cppParamCount,cppCognitiveComplexity,cppNestedBreak,cppMutableGlobal,cppRelaxedAtomic,cppEqualsDefaultThrow,cppOptionalImplicit,cppPlatformVoidPtr,cppTopLevelCatch,cppEmptyCatch,cppCatchAll,cppLookaheadLoop,cppNonOwningIter,cppSinkFnPointer,cppReinterpretFd,cppMunmapConstCast,cppRealpathFree"
            "-Dsonar.issue.ignore.multicriteria.cppHiddenFriend.ruleKey=cpp:S2807"
            "-Dsonar.issue.ignore.multicriteria.cppHiddenFriend.resourceKey=cpp/**"
