# ============================================================================
# Aero1553 Configuration File
# ============================================================================
#
# This file controls the behavior of aero1553. Copy it and customize
# as needed, then pass it to the CLI with:
#
#     aero1553 --config my-config.toml decode recording.mie
#
# CLI arguments take precedence over values in this file. For example,
# --log-level DEBUG will override the level set here.
#
# File format: TOML (https://toml.io)
# ============================================================================


[logging]
# ──────────────────────────────────────────────────────────────────────────
# Logging verbosity level.
#
# Controls how much diagnostic output is written to stderr. Higher levels
# produce less output.
#
#   DEBUG    — Per-record decode details, CLI parsed arguments,
#              truncation events.
#   INFO     — File open/close, decode start/complete with counts and
#              elapsed time, auto-detected timestamp format, CSV row counts,
#              progress checkpoints every 100,000 messages, and the one-time
#              IRIG day-of-year advisory (see irig_day_advisory below).
#   WARNING  — Invalid records (non-fatal), freerun timestamps, unknown
#              message types encountered. ("WARN" is an accepted alias.)
#   ERROR    — File not found, empty file, write failures.
#   CRITICAL — Suppresses all output (the decoder emits no CRITICAL-level
#              messages), same effect as OFF.
#   OFF      — Silence all output.
#
# Default: "WARNING"
# ──────────────────────────────────────────────────────────────────────────
level = "WARNING"

# ──────────────────────────────────────────────────────────────────────────
# Emit the one-time IRIG day-of-year advisory (L2-LOG-001).
#
# The day-of-year field has a known firmware-dependent discrepancy on some
# DDC card models; hour, minute, second and microsecond are unaffected. The
# decoder cannot tell whether YOUR card is one of them — the model is not
# recorded in the file — so the advisory is a standing disclaimer that fires
# once per decode on every calendar-locked (non-freerun) IRIG recording,
# not a finding about the file in front of it.
#
# Because of that it is logged at INFO, so it is already silent at the
# default WARNING level. Set this to false to suppress it at INFO and DEBUG
# too — the right setting once you have diffed your card model's day-of-year
# against vendor CSV and found it correct (see docs/VENDOR-CSV-DIFFS.md
# section 5). Do NOT reach for `level = "ERROR"` to silence it: that also
# discards sync-recovery, non-monotonic-DELTA and sort-cap warnings, which
# are observations about your actual recording.
#
# CLI override: --no-irig-day-advisory
#
# Default: true
# ──────────────────────────────────────────────────────────────────────────
irig_day_advisory = true


[decode]
# ──────────────────────────────────────────────────────────────────────────
# How timestamps are PARSED from the binary file.
#
# DDC recording cards support two timestamp encodings, configured at
# recording time. All records in a single file use the same one.
#
#   auto     — Auto-detect by probing the Command Word at both possible
#              offsets across the first records and scoring which produces
#              a valid MIL-STD-1553 command (bounded multi-record probe;
#              see decode.detect_records). Recommended for most workflows.
#   irig     — 48-bit IRIG-B timestamp (3 × 16-bit words). Provides
#              absolute wall-clock time: day-of-year, hour, minute,
#              second, microsecond. Requires an external IRIG time source.
#   standard — 32-bit free-running counter (2 × 16-bit words). Provides
#              relative timing only. Tick rate is card-dependent and not
#              encoded in the file.
#
# This key governs PARSING only. How the TIME_STAMP column is WRITTEN is a
# separate choice — see [output] output_time_format.
#
# RENAMED IN v3.0.0: this key was `time_format`. The old name is rejected
# (not ignored), because silently discarding a forced format would revert
# the decode to auto-detection without saying so.
#
# CLI override: --input-time-format
#
# Default: "auto"
# ──────────────────────────────────────────────────────────────────────────
input_time_format = "auto"

# ──────────────────────────────────────────────────────────────────────────
# Strict decoding mode.
#
# When true, the decoder raises exceptions on invalid or unknown records
# instead of logging warnings and continuing. Useful for data validation
# and debugging, but will abort on the first problem encountered.
#
# Default: false
# ──────────────────────────────────────────────────────────────────────────
strict = false

# ──────────────────────────────────────────────────────────────────────────
# Error handling mode.
#
# Controls how errored messages (Type Word bit 14 set) and spurious data
# records (type 0x20) appear in output.
#
#   inline   — Errored and spurious messages are included in the main
#              CSV alongside normal messages. The ERROR column contains
#              "ERROR" or "SPURIOUS", and the ERROR_CODE column contains
#              the DDC hardware code (0x01xx) or decoder code (0x20xx).
#              This is the default: one file, no record omitted from it,
#              and the same layout the DDC vendor tool emits (so a decode
#              diffs against vendor output without extra flags).
#   separate — Errored and spurious messages are written to a separate
#              file named ``<output_stem>_errors<output_suffix>``, leaving
#              only clean messages in the main CSV. Opt in when a
#              downstream consumer must not see error rows at all.
#
# Overridden by --separate-errors (which selects "separate"). Stdout output
# is always inline — a stream cannot be split — so the setting is ignored
# there with a WARN.
#
# Default: "inline"
# ──────────────────────────────────────────────────────────────────────────
error_mode = "inline"

# ──────────────────────────────────────────────────────────────────────────
# Partial-output mode on unrecoverable sync loss.
#
# Controls what happens when the decoder hits a mid-file corruption it
# cannot resync past.
#
#   false — Abort. The temporary output is unlinked, the destination file
#           is left untouched, and the CLI exits 3 (unrecoverable sync loss).
#   true  — Keep what was decoded: the rows up to the corruption point are
#           written to "<destination>.partial" (the real destination is not
#           touched) and the CLI exits 0 with a WARN summary.
#
# Use true when investigating a recording known to be corrupt; use false in
# pipelines where any unrecoverable corruption should fail the run.
# Overridden by --allow-partial.
#
# Default: false
# ──────────────────────────────────────────────────────────────────────────
allow_partial = false

# ──────────────────────────────────────────────────────────────────────────
# Timestamp-format auto-detection probe size.
#
# Only used when input_time_format = "auto". The decoder probes this many
# records from the start of the record stream, scoring each one as IRIG and as
# Standard, then commits to whichever wins (IRIG on a tie). Higher values
# make the IRIG-vs-Standard call more robust on recordings whose leading
# records score weakly, at a small startup cost; the walk is bounded by the
# file's actual record count.
#
# This is NOT the sync look-ahead — that is lookahead_records, below.
#
# Must be an integer in [1, 32]. Overridden by --detect-records.
#
# Default: 8
# ──────────────────────────────────────────────────────────────────────────
detect_records = 8

# ──────────────────────────────────────────────────────────────────────────
# Continuous-validation / sync-recovery look-ahead.
#
# A record is only accepted as valid if this many following records also
# validate. The two-record default defends against false-positive resyncs
# on data that coincidentally looks like a valid Type Word. Increase it for
# recordings where corruption aligns on plausible-looking headers and
# defeats the default.
#
# Must be an integer in [1, 32]. Overridden by --lookahead-records.
#
# Default: 2
# ──────────────────────────────────────────────────────────────────────────
lookahead_records = 2

# ──────────────────────────────────────────────────────────────────────────
# Standard-timestamp tick rate (Hz).
#
# The "standard" timestamp format is a free-running 32-bit counter. Its
# tick rate is card-dependent and is NOT recorded in the file, so by
# default the decoder cannot express Standard timestamps as real time:
# the DELTA column is left empty for Standard-format records.
#
# If you know your recording card's counter frequency, set it here (in
# Hz) to convert ticks to microseconds and enable DELTA for Standard
# records. For example, a 1 MHz counter:
#
#   standard_tick_rate_hz = 1000000.0
#
# The value must be greater than 0. This setting has no effect on IRIG
# recordings (IRIG already carries absolute time). Leaving it unset
# preserves the default empty-DELTA behavior.
#
# Default: unset (no calibration)
# ──────────────────────────────────────────────────────────────────────────
# standard_tick_rate_hz = 1000000.0


[filter]
# ──────────────────────────────────────────────────────────────────────────
# Message filtering.
#
# Filters are applied after decoding and before CSV output. Filtered
# messages are silently dropped — they do not appear in the output CSV
# and are not counted in the message count.
#
# All filter lists use OR logic: a message is excluded if it matches
# ANY exclude criterion.
# ──────────────────────────────────────────────────────────────────────────

# Exclude messages by Type Word message type name.
#
# Valid names (case-insensitive):
#   MODE_COMMAND        — Mode code messages (type 0x01)
#   BC_TO_RT            — Bus Controller to Remote Terminal (type 0x02)
#   RT_TO_BC            — Remote Terminal to Bus Controller (type 0x04)
#   RT_TO_RT            — Terminal-to-Terminal transfers (type 0x08)
#   BROADCAST_BC_TO_RT  — Broadcast BC→RT (type 0x10)
#   BROADCAST_RT_TO_RT  — Broadcast RT→RT (type 0x18)
#   SPURIOUS_DATA       — Spurious bus noise (type 0x20)
#
# Example: exclude only spurious data and mode codes
#   exclude_types = ["SPURIOUS_DATA", "MODE_COMMAND"]
#
# Default: [] (no types excluded)
# ──────────────────────────────────────────────────────────────────────────
exclude_types = []

# Exclude messages by Remote Terminal address.
#
# RT addresses are integers 0–31. Address 31 is the broadcast address.
#
# Example: exclude broadcast messages and RT 0 (often unused)
#   exclude_rts = [0, 31]
#
# Default: [] (no RTs excluded)
# ──────────────────────────────────────────────────────────────────────────
exclude_rts = []

# Exclude messages by bus.
#
# Valid values: "A", "B" (case-insensitive)
#
# Example: decode only Bus A, ignoring Bus B
#   exclude_buses = ["B"]
#
# Default: [] (no buses excluded)
# ──────────────────────────────────────────────────────────────────────────
exclude_buses = []

# Exclude messages by subaddress.
#
# Subaddresses are integers 0–31. SA 0 and SA 31 are mode code
# subaddresses per MIL-STD-1553B.
#
# Example: exclude mode code subaddresses
#   exclude_subaddresses = [0, 31]
#
# Default: [] (no subaddresses excluded)
# ──────────────────────────────────────────────────────────────────────────
exclude_subaddresses = []


[output]
# ──────────────────────────────────────────────────────────────────────────
# Output format settings.
#
# These settings control CSV output behavior. Future versions will add
# support for Parquet (v4.0) and decoded data word CSVs (v3.0).
# ──────────────────────────────────────────────────────────────────────────

# Output file format.
# Options: csv (more formats in future versions)
# Default: "csv"
format = "csv"

# ──────────────────────────────────────────────────────────────────────────
# Overwrite protection.
#
#   false — Overwriting an existing output file succeeds (matches the usual
#           batch-rerun expectation).
#   true  — Refuse to overwrite an existing destination; the CLI surfaces a
#           clobber-refused error and exits 1. In "separate" error mode the
#           check covers BOTH the main output and the errors file.
#
# Overridden by --no-clobber.
#
# Default: false
# ──────────────────────────────────────────────────────────────────────────
no_clobber = false

# ──────────────────────────────────────────────────────────────────────────
# How the TIME_STAMP column is WRITTEN (L2-WRT-025).
#
# This is the OUTPUT half of what was one `time_format` key before v3.0.0.
# [decode] input_time_format decides how the bytes on disk are parsed; this
# decides how the resulting instant is written down. The two are independent.
#
#   doy — DAY:HH:MM:SS.uuuuuu, e.g. 192:15:54:50.456225
#         The DDC vendor rendering, and the DEFAULT. Needs nothing else.
#         This is the only setting that keeps output byte-comparable against
#         vendor CSV (see docs/VENDOR-CSV-DIFFS.md).
#   iso — YYYY-MM-DDTHH:MM:SS.uuuuuu plus a zone designator,
#         e.g. 2026-07-11T15:54:50.456225Z
#         Requires `year` below. Zone comes from `utc_offset` (default UTC).
#   dom — DD:HH:MM:SS.uuuuuu, e.g. 11:15:54:50.456225
#         Day of month. Requires `year`. NOTE the month is not in the cell:
#         the value identifies a day within a month you must know from the
#         recording campaign, not a date on its own.
#
# Standard-format (free-running counter) recordings render as raw hex under
# `doy` and are REFUSED under `iso`/`dom` — a counter has no calendar date.
# The same applies to freerun IRIG recordings.
#
# CLI override: --output-time-format
#
# Default: "doy"
# ──────────────────────────────────────────────────────────────────────────
output_time_format = "doy"

# ──────────────────────────────────────────────────────────────────────────
# Calendar year used to resolve the IRIG day-of-year field (L2-WRT-026).
#
# An IRIG-B timestamp carries day-of-year, hour, minute, second and
# microsecond — but NOT the year. Day 192 is July 10 in a leap year and
# July 11 in a common year, so `iso` and `dom` cannot resolve a date without
# being told which year the recording is from.
#
# There is no year the decoder could default to that would be right: the
# system clock would date a 2019 archive with the year you decoded it, and a
# file's mtime does not survive a copy. So this is left unset, and selecting
# `iso` or `dom` without it is an error (exit 4) rather than a guess.
#
# Ignored entirely by `doy`, which prints the day-of-year field verbatim.
#
# If a record's day-of-year does not exist in the configured year — day 366
# against a common year — the decode is refused rather than rolled into
# January: that condition means the configured year is wrong, which makes
# every date in the output suspect, not just that one row.
#
# Range: 1–9999. CLI override: --year
#
# Default: unset
# ──────────────────────────────────────────────────────────────────────────
# year = 2026

# ──────────────────────────────────────────────────────────────────────────
# Zone designator for the `iso` rendering (L2-WRT-025).
#
# IRIG-B carries no timezone. This key states what the recording could not,
# so set it to whatever your site's IRIG source is disciplined to. It is
# applied as a designator only — the time fields are never shifted.
#
#   "Z"       — UTC. The default, and correct for most IRIG installations.
#   "+HH:MM"  — east of UTC, e.g. "+05:30"
#   "-HH:MM"  — west of UTC, e.g. "-05:00"
#
# An offset of +00:00 renders as "Z". Ignored by `doy` and `dom`.
#
# CLI override: --utc-offset
#
# Default: "+00:00" (UTC)
# ──────────────────────────────────────────────────────────────────────────
utc_offset = "+00:00"

# ──────────────────────────────────────────────────────────────────────────
# Canonical row order: equal-timestamp run cap (L1-OUT-003 / L2-WRT-022).
#
# Rows are always written in canonical order — ascending TIME_STAMP, then
# ascending RT, then MSG (subaddress ascending, R before T at the same
# subaddress). Records sharing one TIME_STAMP are the only ones reordered,
# and only against each other; the decoder never reorders across differing
# timestamps. SPURIOUS_DATA rows have no RT/MSG, so they stay pinned
# immediately after the record they followed, keeping an errored record and
# its 0x2000 continuation adjacent.
#
# This setting caps how many consecutive same-TIME_STAMP records may be held
# in memory at once. Real ties are tiny (a 1553 bus runs one transaction at a
# time, so ties come from the two concurrent buses or from overlapping
# recorders in a merge). The cap exists for corrupt recordings whose
# timestamps all decode to one value, which would otherwise buffer the whole
# file. On overflow the records buffered so far are written in arrival order
# with one WARN, the rest of the run is gathered afresh (and sorted) as a new
# group, and decoding continues — no records are lost. A run longer than the
# cap therefore WARNs once per cap-sized chunk.
#
#   1        — disables reordering entirely: every record is its own run, so
#              output is raw DDC capture order. Use this for a byte-for-byte
#              vendor-CSV diff (see docs/VENDOR-CSV-DIFFS.md). Silent: no WARN.
#   65536    — the default; far above any real tie (about 10 MB worst case).
#   1048576  — the maximum.
#
# Overridden by --max-sort-group.
#
# Default: 65536
# ──────────────────────────────────────────────────────────────────────────
max_sort_group = 65536


[mux]
# ──────────────────────────────────────────────────────────────────────────
# MUX column from the input file name (L2-WRT-020).
#
# When enabled, the MUX column is filled from a field of each input's file
# name — useful when recordings are named so a field encodes the source /
# recorder, e.g.  full_loadout.draw.data.1553.aa.unused.mie_irig  where the
# 5th dot-separated field (index 4) is the recorder id "aa". In a multi-file
# merge each row carries the MUX of the file it was decoded from.
#
# NOTE: this is ON by default, so default output is NOT byte-for-byte vendor
# CSV when the input name has the field. For a vendor-exact diff, set
# enabled = false (or pass --no-mux). See docs/VENDOR-CSV-DIFFS.md.
# ──────────────────────────────────────────────────────────────────────────

# Populate MUX from the file name. Overridden by --no-mux (which sets false).
# Default: true
enabled = true

# Field separator applied to the file's basename. Must be non-empty.
# Overridden by --mux-delimiter. Default: "."
delimiter = "."

# 0-based index of the MUX field; a negative value counts from the end
# (e.g. -3 selects the third-from-last field). An out-of-range index leaves
# MUX empty. Overridden by --mux-field. Default: 4
field = 4

[merge]
# ──────────────────────────────────────────────────────────────────────────
# DELTA measurement scope (L2-MRG-005).
#
# Only affects a MULTI-FILE decode; with a single input the two are the same
# computation and this key has no effect.
#
#   "per-file" — Default. Each record's DELTA is the gap to the previous
#                same-RT/MSG record FROM ITS OWN FILE, so the value is
#                identical to decoding that file on its own. This is also what
#                the DDC vendor tool reports, since it has no merge feature.
#   "global"   — Each record's DELTA is the gap to the previous same-RT/MSG
#                record from ANY input, measured across the merged timeline.
#                Answers "how long since any recorder last saw this key".
#                Compresses gaps whenever one key appears in several inputs.
#
# Overridden by --delta-scope.
#
# Default: "per-file"
# ──────────────────────────────────────────────────────────────────────────
delta_scope = "per-file"

# ──────────────────────────────────────────────────────────────────────────
# Cross-recorder duplicate collapsing (L2-MRG-007).
#
# On a MIL-STD-1553 bus, multiple recorders can witness the SAME transaction
# (they all listen to the same wire). In a multi-file merge the decoder
# normally emits both rows — adjacent, tiebroken by input order — which
# inflates the merged message count when recorders overlap. Collapsing
# suppresses those cross-recorder duplicates, keeping one row per bus event.
#
# A "duplicate" is the same wire content (Type / Command / Status Words, data
# words, error word) seen by a DIFFERENT input file within collapse_window_us
# microseconds. Identical records from the SAME file are never collapsed (real
# periodic traffic), and a single-file decode is unaffected.
#
# This is OFF by default — the default never drops a row. Applies only to a
# multi-file merge.
# ──────────────────────────────────────────────────────────────────────────

# Enable cross-recorder duplicate collapsing. Overridden by
# --collapse-duplicates. Default: false
collapse_duplicates = false

# Timestamp tolerance in microseconds: two recorders' copies of the same event
# collapse when their timestamps differ by at most this much. 0 means an exact
# microsecond match (the safest setting); widen it for recorders whose IRIG
# clocks are not perfectly synced. Overridden by --collapse-window-us.
# Default: 0
collapse_window_us = 0

# Cap on how many survivors the collapse window retains at once (L2-MRG-008).
#
# collapse_window_us bounds retention in TIME. It cannot bound it in COUNT: a
# corrupt recording whose timestamps all decode to one value, or a wide window
# on a dense bus, puts arbitrarily many records inside a single window. This is
# the second bound, and it is what makes the merge's constant-memory guarantee
# unconditional -- the same role output.max_sort_group plays for the
# canonical-order stage, with the same default for the same reason.
#
# On reaching the cap the decoder drops the oldest survivor to make room, emits
# ONE warning for the whole run, and carries on: collapsing becomes best-effort
# rather than exact. No record is ever dropped from the OUTPUT.
#
# Raise it if you widen collapse_window_us on a busy bus and see that warning.
# Range: 1-1048576. Overridden by --max-collapse-survivors. Default: 4096
max_collapse_survivors = 4096
