[project]
name = "aero1553"
version = "3.0.0"
description = "Decoder for DDC MIL-STD-1553 MIE binary recording files"
authors = [
    { name = "Joey" },
]
readme = "README.md"
license = "Apache-2.0"
# A copy of the repository-root LICENSE: PEP 639 forbids a license-files path
# outside the project directory. scripts/repo-hygiene.sh keeps the two identical.
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.scripts]
aero1553 = "aero1553.cli:main_cli"

# PEP 735 dependency groups: `uv sync` installs `dev` by default. The ranges
# are the ones the Poetry `^` specifiers expressed; uv.lock pins the exact
# versions CI runs.
[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=7.0,<8",
    "mypy>=1.13,<2",
    "pylint>=4.0.6,<5",
    "ruff>=0.15.20,<0.16",
    "vulture>=2.16,<3",
    "bandit>=1.9.4,<2",
]

# The package is pure Python plus one compiled module, `aero1553._native`,
# built from native/ -- a PyO3 binding over the Rust crate in ../rust.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "aero1553._native"
# Switched on here rather than in native/Cargo.toml so a plain `cargo test`
# of the binding crate still links libpython.
features = ["pyo3/extension-module"]

[tool.uv]
# An editable install is rebuilt only when one of these changes. The Rust
# sources are listed -- the binding's AND the core crate's -- because a
# change to either changes the compiled module, and without them `uv run`
# would keep importing a stale build.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/Cargo.toml" },
    { file = "native/src/**/*.rs" },
    { file = "../rust/Cargo.toml" },
    { file = "../rust/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requirement(req_id): tag a test with the L1/L2/L3 requirement id it verifies (see docs/L1-REQ.md, L2-REQ.md, L3-REQ.md)",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# `tomli` (the 3.10 TOML backport, conditionally imported in config.py)
# is not installed in the dev/type-check environment and is not part of
# our typed surface, so treat its import as untyped rather than vendoring
# stubs.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

# Coverage gate parallels the Rust crate's cargo-llvm-cov gate
# (rust/.cargo/config.toml's `cov-ci` alias, 87 line / 86 region). The
# combined line+branch coverage held ~90% for several releases, which put the
# floor at baseline-2pp (88%). The v2.9.0 canonical-row-order work
# (L1-OUT-003) added `order.py` at 100% and lifted the package to 94.65%, so
# the floor is re-ratcheted to baseline-2pp again (92%), matching the Rust
# ratchet rationale. `fail_under` below is the single source of truth — CI runs
# `pytest --cov` and the gate fails the build automatically.
#
# __main__.py is the entry shim (python -m aero1553) — three-line
# wrapper around cli.main(), uncoverable without spawning a child
# process. Mirrors the Rust exclusion of rust/src/bin/aero1553.rs.
[tool.coverage.run]
source = ["aero1553"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 92

# Pylint lints the package source (src/aero1553). Genuine correctness/hygiene
# checks stay on; checks that conflict with deliberate design choices or
# duplicate SonarCloud are disabled below. Run: `uv run pylint src` (from python/).
[tool.pylint.basic]
# Keep pylint's default "good" short names and allow `tomllib` — the module
# alias for the TOML backend (mirrors the stdlib module name; config.py binds
# it to tomllib/tomli/None across Python versions).
good-names = ["i", "j", "k", "ex", "Run", "_", "tomllib"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    # The codebase uses function-local imports on purpose, to avoid import
    # cycles and keep CLI startup cheap (mirrors the Rust crate's structure).
    "import-outside-toplevel",
    # Size/complexity heuristics with low default thresholds. A binary decoder
    # is legitimately branchy, and cognitive complexity is already gated by
    # SonarCloud (python:S3776) — keeping these would be duplicate, lower-signal
    # noise.
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-lines",
    # `not (a <= x <= b)` parenthesization is kept for readability.
    "superfluous-parens",
    # Single-responsibility helper classes (e.g. the merge dedup window) are
    # legitimately one-method; this check is noise for them.
    "too-few-public-methods",
]

# Ruff formats and lints the Python package + tests. Line length matches the
# pylint gate (100); the default lint ruleset (E/F) is kept and the formatter
# owns code style. Run: `uv run ruff format` / `uv run ruff check` (from python/).
[tool.ruff]
line-length = 100
target-version = "py310"
# Required for the `DOC` (pydoclint) family selected below, which is still a
# preview rule set. Safe to depend on here because CI installs with
# `uv sync --locked` against uv.lock, so ruff is pinned to an exact version --
# a preview rule can only change behaviour on a deliberate lock bump, never
# under an unattended CI run.
#

# Ruff's DEFAULT rule set is only `E4`, `E7`, `E9` and `F` -- a small slice of
# the ~800 rules it ships. Until this section existed the gate reported "All
# checks passed" while running almost nothing, which is the same shape as the
# clippy gap that let SonarCloud report five Rust findings `cargo clippy` called
# clean: a tool is only as strict as the rules you asked it for.
#
# Selected by family rather than exhaustively. `ALL` is not a target -- it
# includes 1003 `S101` hits for `assert` in a test suite where assert is the
# point, plus rules that contradict the formatter.
[tool.ruff.lint]
# Scoped to the LINTER. `preview` at the `[tool.ruff]` top level also switches
# the FORMATTER into preview style, which restyled six unrelated files on the
# commit that introduced this -- formatting churn has nothing to do with
# docstring rules.
preview = true

# A preview rule fires only when selected by its EXACT code, never by family
# prefix. Without this, `preview` (needed for pydoclint) would also enable
# preview rules across RUF, ISC and the rest -- a gate should widen because
# someone chose to widen it.
explicit-preview-rules = true

select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import ordering
    "N",         # pep8 naming
    "UP",        # pyupgrade -- keeps us on py310 idiom
    "B",         # bugbear: real bug shapes
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "SIM",       # simplifiable code
    "RET",       # return-path clarity
    "PTH",       # pathlib over os.path
    "PIE",       # misc lint
    "PERF",      # performance
    "RUF",       # ruff's own
    "ARG",       # unused arguments
    "ISC",       # implicit string concat
    "LOG", "G",  # logging correctness
    "T20",       # stray print/pprint
    "TID",       # tidy imports
    "DTZ",       # naive datetimes
    "SLF",       # reaching into another module's private members
    # pydoclint (preview -- selected by exact code, see explicit-preview-rules).
    # DOC502 is deliberately NOT selected: it flags a documented exception the
    # function does not `raise` itself, and every finding here documents one
    # that PROPAGATES from a helper -- `write_csv` naming `MieClobberRefusedError`,
    # `decode.py` naming `struct.error` from an unpack. Which exceptions escape
    # is what a caller needs; where in the call tree they originate is not.
    # Complying would mean DELETING true documentation.
    "DOC201",    # a `return` is documented
    "DOC402",    # a `yield` is documented
    "DOC501",    # a `raise` is documented
]

ignore = [
    # `open()` is idiomatic and correct; `Path.open()` is a style preference,
    # not a fix. It also sits on the input path SonarCloud has a scoped
    # suppression for (see .github/workflows/sonarcloud.yml) -- rewriting the
    # call to satisfy a style rule would disturb a taint flow that was analysed
    # and documented deliberately.
    "PTH123",
    # `os.replace()` IS the atomic-rename primitive the writer needs
    # (L2-WRT-015). `Path.replace()` calls it; naming it directly says what the
    # guarantee is.
    "PTH105",
    # A `try`/`except` inside the record loop is the per-record error contract,
    # not an oversight: a bad record is reported and the walk continues.
    "PERF203",
]

# Deliberately NOT disabling the confusable-character rules. The en and em
# dashes are prose punctuation used consistently across all three
# implementations' comments; allowing exactly those keeps the rule live for a
# genuinely deceptive homoglyph (a Cyrillic `а` in an identifier, say).
# `×` is the multiplication sign in prose ("2 × 32 words"), not a stand-in
# for the letter x.
# U+00B5 MICRO SIGN is the correct character for microseconds, which is the
# unit this decoder works in throughout (IRIG timestamps are microsecond
# counts). Ruff suggests U+03BC GREEK SMALL LETTER MU; that is the letter,
# not the SI prefix. Surfaced only because `preview` is now on.
allowed-confusables = ["–", "—", "×", "µ"]

[tool.ruff.lint.per-file-ignores]
# The CLI's whole job is writing to stdout: the `count` integer, `--help`, the
# `dump` report. T20 stays enabled everywhere else, which is where a stray
# debugging `print` would actually be a defect.
#
# ARG002: argparse calls `Action.__call__(parser, namespace, values,
# option_string=...)` BY NAME. The unused parameters are the interface;
# renaming them to `_parser` breaks the call.
"src/aero1553/cli.py" = ["T201", "ARG002"]

# SIM115: these files outlive the opening scope BY DESIGN -- the reader owns a
# mapping and the writer owns a temp file until `commit()` renames it. A `with`
# block would close them at exactly the wrong moment; the lifetime is the
# object's, and each has an explicit close on every path.
"src/aero1553/reader.py" = ["SIM115"]
"src/aero1553/writer.py" = ["SIM115"]

# ARG002: a pytest test requests a fixture for its SIDE EFFECT as often as for
# its value -- `capsys` starts capturing, `tmp_path` creates a directory. An
# unused fixture parameter is the normal way to ask for that, so the rule is
# noise here while staying useful in `src`, where an unused argument really is
# one.
"tests/**" = [
    # DOC*: a test helper has no callers outside the file it lives in, so a
    # `Returns:` section restates its one-line summary. The rules stay on in
    # `src`, where the caller is someone else.
    "DOC201",
    "DOC402",
    "DOC501",
    "ARG002",
    # SLF001: a white-box test reaching into a private member is the point of a
    # white-box test. `src` is clean of it and stays gated, which is where
    # reaching across a privacy boundary would actually be a design smell.
    "SLF001",
]

# A benchmark's report IS its output, printed to the terminal it was run from
# (T201), and like the test helpers above its functions have no callers
# outside the file (DOC*).
"benchmarks/**" = ["T201", "DOC201", "DOC402", "DOC501"]

# Vulture finds dead code. Scan src + tests together so test usage counts (a
# function used only by tests is not "dead"). The ignored names are intentional:
# `option_string` is the argparse Action.__call__ interface arg; the two
# constants are documented module reference values (MAX_RECORD_BYTES is also in
# docs/diagrams/class.svg) that stay part of the surface though unused in-tree.
# Run: `uv run vulture` (from python/).
[tool.vulture]
paths = ["src", "tests"]
ignore_names = [
    "option_string",
    "MAX_RECORD_BYTES",
    "ALL_KNOWN_ERROR_CODES",
    # pytest autouse fixtures are invoked by the framework, never by name.
    "_restore_package_logger_state",
]
