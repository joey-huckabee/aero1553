# Cargo aliases for cargo-llvm-cov coverage workflows.
#
# Single quotes (TOML literal strings) keep the regex verbatim — no
# backslash escape processing — so [\\/] matches a Windows backslash
# OR a Unix forward-slash. Match the binary entry shim by exact
# basename to avoid accidentally excluding any future file.
#
# Run order in normal use:
#   cargo cov         → local: HTML report, opens browser
#   cargo cov-lcov    → CI/IDE: writes lcov.info
#   cargo cov-ci      → enforces the gate; non-zero exit if below
#                       --fail-under-lines or --fail-under-regions
#
# Thresholds match the agreed-upon floors. The original 70/70 gate sat
# ~5pp below the v1.0.0 baseline (74.81% lines / 71.55% regions) to
# absorb refactor drift. Coverage has since stabilized well above that
# (85.98% lines / 85.08% regions at the v1.4.1 measurement), which put the
# gate at baseline-2pp (84 lines / 83 regions). The v2.9.0 canonical-row-order
# work (L1-OUT-003) added `order.rs` at 100% lines / 99.63% regions and lifted
# the crate to 89.50% lines / 88.63% regions, so the gate was re-ratcheted to
# baseline-2pp again (87 lines / 86 regions). It has since been ratcheted once
# more, to the current **90 lines / 89 regions** in the alias below. The crate
# has no platform-gated (`cfg(windows/unix)`) code, so the Linux CI number
# matches local runs — there is no cross-platform slack to budget for.
#
# THE ALIAS BELOW IS THE ONLY SOURCE OF TRUTH for these numbers. This comment
# said 87/86 while the alias enforced 90/89, and rust/README.md, CONTRIBUTING.md
# and MAINTAINER-GUIDE.md all repeated the stale pair. If you ratchet the gate,
# update those three and this paragraph in the same commit —
# `scripts/repo-hygiene.sh` now fails the build when they disagree.

[alias]
cov      = 'llvm-cov --html --open --ignore-filename-regex=bin[\\/]aero1553\.rs$'
cov-lcov = 'llvm-cov --lcov --output-path lcov.info --ignore-filename-regex=bin[\\/]aero1553\.rs$'
cov-ci   = 'llvm-cov --fail-under-lines 90 --fail-under-regions 89 --ignore-filename-regex=bin[\\/]aero1553\.rs$'
