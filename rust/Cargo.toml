[package]
name = "aero1553"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "Decoder for DDC MIL-STD-1553 MIE binary recording files"
license = "Apache-2.0"
authors = ["Joey"]
readme = "README.md"

# cargo-semver-checks lint policy. `DecoderConfig` and `ConfigOverrides`
# (src/config.rs) are internal config plumbing — nothing outside the crate
# constructs them, and the stable public API is the `lib.rs` re-exports. They are
# `#[doc(hidden)]` so their growing field set is excluded from the SemVer
# contract; this `allow` accepts the one-time doc-hidden transition in v2.5.0
# (the gate still guards the real public API). See L1-MRG-003 / L2-MRG-007.
#
# `log::emit` (src/log.rs) is the same situation for a function. It must be `pub`
# so the exported `log_*!` macros resolve it at a call site in another crate, and
# `#[doc(hidden)]` is the marker that says "reachable, not API". It was
# previously spelled `_emit`, using an underscore to mean the same thing —
# which contradicts the convention that `_name` is *unused* and is what
# clippy::used_underscore_items objects to. The old path is kept as a re-export,
# so this is not a removal; only the doc-hidden transition needs accepting, and
# it is accepted for exactly the reason the struct one was.
[package.metadata.cargo-semver-checks.lints]
struct_now_doc_hidden = "allow"
function_now_doc_hidden = "allow"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aero1553"
path = "src/bin/aero1553.rs"

[dependencies]
memmap2 = "0.9"

# Lint policy lives here so plain `cargo build` / `cargo clippy` enforce it, not
# just the CI flags. All three pass clean today; they formalize practices the
# crate already follows (the CI `clippy -- -D warnings` gate still applies on
# top of these).
[lints.rust]
# Require an explicit `unsafe {}` block for unsafe operations inside an
# `unsafe fn` (warn-by-default in edition 2024; denied here).
unsafe_op_in_unsafe_fn = "deny"
# Flag `pub` items that aren't reachable from the crate root — they should be
# `pub(crate)`. Keeps the public API surface intentional.
unreachable_pub = "deny"

[lints.clippy]
# Every `unsafe {}` block must carry a `// SAFETY:` comment. Promotes the
# repo's existing SAFETY-comment convention (also grep-checked by the
# pre-commit hook) from a heuristic to a real lint. This one is `restriction`,
# not `pedantic`, so the group below does not cover it.
undocumented_unsafe_blocks = "deny"

# THE PEDANTIC GROUP, DENIED WHOLESALE.
#
# WHY THIS IS NOT REDUNDANT WITH `cargo clippy -- -D warnings`:
# `-D warnings` only denies lints that actually FIRE, and clippy's pedantic /
# nursery / restriction groups are allow-by-default -- so they never fire and
# `-D warnings` never sees them. SonarCloud's Rust rules map onto clippy's
# INCLUDING those tiers, which is why Sonar reported findings the local gate
# reported none of. That reads as clippy disagreeing with itself; it is really
# two different lint sets.
#
# `priority = -1` lets the individual `allow`s below (priority 0) override the
# group. Removing it makes every exception a hard error instead.
#
# CONSEQUENCE OF GROUP-LEVEL DENY: a clippy upgrade can add pedantic lints, so a
# toolchain bump can turn this build red on code that did not change. That is
# the intended trade -- it surfaces on a PR, not in a release -- but it means
# the fix for a surprise red build is sometimes an entry in the list below
# rather than a change to the code.
#
# What the group has already caught that `-D warnings` could not: a saturating
# `as` cast in `StandardTimestamp::to_microseconds` that turned an absurd tick
# rate into `u64::MAX` and read downstream as a real timestamp (it now answers
# `None`); `log::_emit`, public-but-underscored where `#[doc(hidden)]` was the
# right marker; `cli::run`'s exit code being droppable; and 34 public fallible
# functions that did not say when they fail.
pedantic = { level = "deny", priority = -1 }

# --- Exceptions. Each is a lint whose every site in this crate is deliberate. ---

# Three of the seven sites are public API (`MieFileReader::with_options`,
# `write_csv`, `write_csv_split`) where an options struct is taken BY VALUE on
# purpose, the way `OpenOptions` is -- changing them to `&` is a breaking change
# for zero benefit. The rest are subcommand dispatch functions that own their
# parsed arguments.
needless_pass_by_value = "allow"

# Every site is a FORMAT-SPECIFICATION TABLE with one arm per MIE message
# format, each carrying its own comment (`ModeCodeTxData => 2, // status + data`
# next to `ModeCodeRxData => 2, // data + status`). The bodies coincide; the
# reasons do not. Merging arms by equal value would delete the specification
# this table exists to be.
match_same_arms = "allow"

# `DecodeArgs`, `DecoderConfig` and `RecordIter` are flag bags on purpose: the
# first mirrors the CLI surface 1:1 and the second mirrors the TOML keys 1:1,
# and that correspondence is the point (see CONFIG-REFERENCE.md). Packing them
# into bitflags or enums would break it to satisfy a counter.
struct_excessive_bools = "allow"

# All three sites are two-case dispatches where BOTH arms do real work -- the
# file-vs-stdout split in `write_csv`, sync recovery hit-vs-miss, and
# first-record found-vs-not. Naming the cases `Some(..)`/`None` documents them
# symmetrically; `if let ... else` buries the second one.
single_match_else = "allow"

# `argv` (the raw process vector, conventionally named) versus `args` (the
# parsed subcommand struct). Two different things, each with the name its own
# domain gives it.
similar_names = "allow"

# `cli::parse_decode` (207 lines) and `MieError`'s `Display` (143) are
# exhaustive dispatch tables -- one arm per flag, one arm per variant. Splitting
# either scatters a table that is read by lookup, not top to bottom. This is the
# same judgement recorded for `cognitive_complexity` below.
too_many_lines = "allow"

# NOT ENABLED: clippy::cognitive_complexity (== sonar rust:S3776), a `nursery`
# lint.
#
# Aligning the threshold looked obvious and does not work. Sonar reported one
# S3776 -- `FilterConfig::should_exclude`, scoring 17 against its limit of 15.
# Setting clippy's threshold to the same 15 flags that function AND two more
# that Sonar does not report at all (`cli::parse_decode` at 23,
# `DecoderConfig::with_overrides` at 18). The two tools compute the metric
# differently, so a matching number buys a stricter local rule, not a predictive
# one -- and `parse_decode` scores high because it is a flat dispatch chain over
# two dozen flags, which is a lookup table written as control flow rather than
# something a reader struggles with.
#
# Left off deliberately: enabling it would mean either contorting a
# well-tested parser or blanket-allowing it, and neither makes SonarCloud any
# more predictable from here.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The Rust half of the performance suite (perf/README.md). Hand-rolled:
# no benchmark framework, so memmap2 stays the only dependency.
[[bench]]
name = "perf"
harness = false
