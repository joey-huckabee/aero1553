# cargo-deny configuration — supply-chain gate for the crate's dependency tree.
# Run: `cargo deny check` (from rust/). Docs: https://embarkstudios.github.io/cargo-deny/
#
# The crate has no dependencies (since 5.0.0, when memmap2 was dropped), so this
# gate is a tripwire: it fails the first time a dependency arrives carrying a
# RustSec advisory, an incompatible license, or a source other than crates.io.

[advisories]
version = 2
# Reject crates whose published version has been yanked from the registry.
# Security vulnerabilities and `unsound` advisories from the RustSec DB are
# denied by default under version = 2.
yanked = "deny"

[licenses]
version = 2
# The crate is Apache-2.0 and has no dependencies. Keep this set tight -- a
# dependency under any other license fails the gate and forces a conscious
# review. "MIT" stays allowed so the common "MIT OR Apache-2.0" crate is not
# refused on license alone; cargo-deny only warns about an unused entry.
allow = ["MIT", "Apache-2.0"]

[bans]
# No duplicate versions of a crate (none today) and no wildcard ("*") version
# requirements — both keep the dependency surface predictable.
multiple-versions = "deny"
wildcards = "deny"

[sources]
# Dependencies must come from crates.io. A git or alternative-registry source
# fails the gate.
unknown-registry = "deny"
unknown-git = "deny"
