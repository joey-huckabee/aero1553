# Generated by scripts/vendor-tablekit.py from tablekit v0.7.0's workspace manifest, trimmed
# to the two crates aero1553 vendors. Edit tablekit upstream, not this file.
[workspace]
resolver = "3"
members = ["crates/tablekit", "crates/tablekit-csv"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/joey-huckabee/tablekit"
