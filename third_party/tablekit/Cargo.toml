[workspace]
resolver = "3"
members = ["crates/tablekit", "crates/tablekit-csv"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/joey-huckabee/tablekit"
publish = false

[workspace.dependencies]
tablekit = { path = "crates/tablekit" }
tablekit-csv = { path = "crates/tablekit-csv" }
# Shortest float digits (zmij: Victor Zverovich's algorithm, ties to even, as NumPy) and
# integer digits (itoa), formatted on the stack: the CSV hot path. Both ported or written by
# David Tolnay, widely used, no dependencies of their own. zmij is exact (=) because a new
# version could change digits; the NumPy corpus test must pass before moving it.
zmij = "=1.0.23"
itoa = "1.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
