[workspace]
resolver = "3"
members = ["crates/tablekit", "crates/tablekit-csv", "crates/tablekit-parquet", "crates/tablekit-profile"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/joey-huckabee/tablekit"
publish = false

[workspace.dependencies]
tablekit = { path = "crates/tablekit" }
tablekit-csv = { path = "crates/tablekit-csv" }
tablekit-profile = { path = "crates/tablekit-profile" }
# Shortest float digits (zmij: Victor Zverovich's algorithm, ties to even, as NumPy) and
# integer digits (itoa), formatted on the stack: the CSV hot path. Both ported or written by
# David Tolnay, widely used, no dependencies of their own. zmij is exact (=) because a new
# version could change digits; the NumPy corpus test must pass before moving it.
zmij = "=1.0.23"
itoa = "1.0.18"
# 59.3.0 (2026-09-01): 60.0.0 needs Rust 1.88, and 59.3.1 was under two weeks old when this
# was chosen. Exact, so every user resolves the same writer. No Arrow layer: the column
# writers are used directly. Snappy only, the compression Impala uses by default.
parquet = { version = "=59.3.0", default-features = false, features = ["snap", "flate2-rust_backend", "zstd"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
